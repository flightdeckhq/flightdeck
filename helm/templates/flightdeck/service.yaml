{{- $component := "flightdeck" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  type: {{ .Values.flightdeck.service.type }}
  selector:
    {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.flightdeck.service.port }}
      targetPort: http
      protocol: TCP
---
# The StatefulSet's headless Service, for stable per-pod DNS; the
# Ingress and clients use the Service above.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightdeck.headlessServiceName" . }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.flightdeck.port }}
      targetPort: http
      protocol: TCP
