{{- /*
The workers apply the migrations embedded in their binary and no
longer read FLIGHTDECK_MIGRATIONS_DIR; this ConfigMap, the mount and
the workers.migrationsDir value are unused and go with the chart's move
to the single flightdeck image. Until then the SQL files are packaged
as a ConfigMap and mounted into every workers pod.

The ConfigMap is built from the helm/migrations/ directory via
.Files.Glob. helm/migrations/ is a build artifact (gitignored),
populated by `make -C helm sync-migrations` which
copies from storage/migrations/postgres/ (the canonical source). The
Makefile wires sync-migrations as a prerequisite of `lint` / `template`
/ `install` / `upgrade`, so any of those targets refreshes the chart
automatically. Direct `helm` commands invoked outside the Makefile
require running `make -C helm sync-migrations` manually first; the
chart will otherwise render an empty ConfigMap on a freshly-cloned
tree.

Adding a new migration: drop the .up.sql / .down.sql pair into
storage/migrations/postgres/ (with its SQLite pair beside it), then run
any chart-render target. No template edit required.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flightdeck.migrationsConfigMapName" . }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "workers") | nindent 4 }}
data:
{{- range $path, $bytes := .Files.Glob "migrations/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
