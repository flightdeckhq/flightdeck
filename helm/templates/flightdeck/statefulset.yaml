{{- $component := "flightdeck" -}}
{{- /*
The flightdeck pods: one binary each, a StatefulSet so that every pod
keeps a data dir of its own (/data: the dashboard token the pod
minted, the TLS cache, and the embedded NATS store when the chart runs
no NATS cluster) across restarts and rolling updates. With one replica
the pod uses its embedded bus; with more, every pod takes
FLIGHTDECK_NATS_URL from the Secret and shares the NATS cluster.
*/ -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ include "flightdeck.headlessServiceName" . }}
  {{- if not .Values.flightdeck.hpa.enabled }}
  replicas: {{ .Values.flightdeck.replicas }}
  {{- end }}
  # Every pod is a whole control plane; none waits on another, so they
  # start together.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      annotations:
        # The binary applies the stream settings at startup, so a change
        # to them rolls the pods and the new settings take effect.
        checksum/nats-stream: {{ printf "%s/%s/%s" (include "flightdeck.natsStreamMaxAgeHours" .) (include "flightdeck.natsStreamMaxSizeMiB" .) (include "flightdeck.natsStreamReplicas" .) | sha256sum | trunc 16 | quote }}
        {{- with .Values.flightdeck.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "flightdeck.serviceAccountName" (dict "root" . "component" $component) }}
      {{- end }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: flightdeck
          image: {{ include "flightdeck.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # The flags the chart decides; the database and bus URLs and
          # the tunables come from the environment (envFrom below).
          command: ["/usr/local/bin/flightdeck"]
          args:
            - "--listen"
            - ":{{ .Values.flightdeck.port }}"
            - "--data-dir"
            - "/data"
            {{- if .Values.flightdeck.metrics.enabled }}
            - "--metrics"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.flightdeck.port }}
              protocol: TCP
            {{- if .Values.flightdeck.metrics.enabled }}
            - name: metrics-workers
              containerPort: 9102
              protocol: TCP
            - name: metrics-ingest
              containerPort: 9103
              protocol: TCP
            - name: metrics-api
              containerPort: 9104
              protocol: TCP
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "flightdeck.configMapName" . }}
            - secretRef:
                name: {{ include "flightdeck.secretName" . }}
          # A first start migrates the database and creates the JetStream
          # store before it serves; the startup probe gives that up to
          # five minutes before liveness takes over.
          startupProbe:
            httpGet:
              path: /ingest/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ingest/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.flightdeck.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- with .Values.flightdeck.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.flightdeck.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.flightdeck.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.flightdeck.data.storageClassName }}
        storageClassName: {{ .Values.flightdeck.data.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.flightdeck.data.size }}
