# Flightdeck price overrides.
#
# Model prices come from a vendored copy of litellm's price list
# (api/internal/store/pricing_catalogue.json, refreshed with
# `make pricing-refresh`). This file is the layer an operator edits on
# top of it; see ARCHITECTURE.md, "Cost estimation", and CONTRIBUTING.md,
# "Updating pricing data".
#
# Rates are USD per 1,000,000 tokens. Model ids are canonicalised the way
# event model ids are (dated snapshots kept; gateway, Bedrock and Vertex
# spellings reduced to the provider's API id), so write the id the
# dashboard shows.
#
# The API reads this file at startup. An entry that fails validation
# makes the API ignore the whole file (and log why) and price from the
# catalogue alone.

version: 2
updated: 2026-10-25

# ---------------------------------------------------------------------
# overrides: replace a catalogue row's rates field by field, or add a
# model the catalogue does not list (then provider, input and output are
# required). Fields: model_id, platform (direct, bedrock, vertex, azure,
# foundry; default direct), provider, input, output, cache_read,
# cache_write_5m, cache_write_1h, reasoning, priority_multiplier,
# fast_multiplier.
#
# Negotiated prices, for example:
#
#   - model_id: claude-sonnet-4-5
#     input: 2.40
#     output: 12.00
# ---------------------------------------------------------------------
overrides:
  # Retired models litellm no longer lists, kept so sessions recorded
  # while they were served keep a cost. List prices at retirement.
  - model_id: claude-opus-4-1-20250805
    provider: anthropic
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_write_5m: 18.75
    cache_write_1h: 30.00
    notes: Retired 2026-08-05

  - model_id: claude-opus-4-20250514
    provider: anthropic
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_write_5m: 18.75
    cache_write_1h: 30.00
    notes: Retired 2026-06-15

  - model_id: claude-3-opus-20240229
    provider: anthropic
    input: 15.00
    output: 75.00
    cache_read: 1.50
    cache_write_5m: 18.75
    cache_write_1h: 30.00
    notes: Retired

  - model_id: claude-sonnet-4-20250514
    provider: anthropic
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00
    notes: Retired 2026-06-15

  - model_id: claude-3-5-sonnet-20241022
    provider: anthropic
    input: 3.00
    output: 15.00
    cache_read: 0.30
    cache_write_5m: 3.75
    cache_write_1h: 6.00
    notes: Retired

  - model_id: claude-3-5-haiku-20241022
