# Dependency update PRs for every ecosystem the repo ships.
#
# - Weekly, Monday morning UTC, so updates land as one predictable batch.
# - cooldown: a release must be 14 days old before Dependabot proposes
#   it. Brand-new releases are where hijacked or broken versions are
#   caught and yanked; the same two-week floor applies to hand-picked
#   pins (action SHAs, base-image digests).
# - Minor and patch updates are grouped into one PR per ecosystem;
#   majors arrive as separate PRs (one per directory), because they are
#   where breaking changes live and each needs its own review.
# - Commit messages follow the repo's conventional-commit rule:
#   "chore(deps): ..." ("chore(deps-dev): ..." for development
#   dependencies).
# - Branch moves stay manual, because each one moves several pins
#   together or needs a migration: nginx and Go minor and major
#   versions (nginx's odd minors are mainline releases; a Go version
#   moves with go.mod, CI's setup-go and the compose dev images), and
#   Node, Postgres and NATS majors (a Postgres major needs a data
#   migration).
#
# Security updates are not subject to the cooldown and arrive as soon
# as an advisory is published (Dependabot security updates are enabled
# in the repository settings).
#
# Not covered: the Trivy image pinned in release.yml's scan step and
# the image tags in the Helm chart's values; bump those by hand.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories:
      - "/api"
      - "/ingestion"
      - "/workers"
      - "/dashboard"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: nats
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directories:
      - "/api"
      - "/ingestion"
      - "/workers"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: pip
    directory: "/sensor"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
