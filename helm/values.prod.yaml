# Example production overrides. Deploy with:
#   helm install flightdeck helm/ -f helm/values.prod.yaml \
#     --set postgres.externalUrl=postgres://... \
#     --set nats.auth.token=...
#
# This file pins production-shaped defaults (three replicas behind an
# HPA, the NATS cluster they share, resources, the Ingress) and leaves
# the secrets and the external Postgres URL to the install command.

flightdeck:
  replicas: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
  workerPoolSize: 20
  corsOrigin: "https://flightdeck.example.com"
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 2000m
      memory: 2Gi

nats:
  # Several replicas share one bus; nats.enabled follows replicas and
  # is stated here so a smaller override cannot turn it off by accident.
  enabled: true
  replicas: 3
  jetstream:
    fileStore:
      size: "50Gi"
    stream:
      # 30 GiB of the 50Gi volume, under the 75% of free space a NATS
      # server reserves at most when it starts.
      maxSizeMiB: 30720
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

postgres:
  # Production deployments should supply an external managed Postgres via
  # --set postgres.externalUrl=... The bundled StatefulSet is not HA and
  # has no backup story. Left empty here so the file stays valid
  # for `helm template` runs without requiring a real secret.
  externalUrl: ""
  storage:
    size: "50Gi"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi

ingress:
  enabled: true
  className: nginx
  host: flightdeck.example.com
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # ingress-nginx refuses bodies over 1m by default; the OTLP receiver
    # under /ingest accepts requests up to 4 MiB.
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
  tls:
    - secretName: flightdeck-tls
      hosts:
        - flightdeck.example.com
