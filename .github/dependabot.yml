# Dependency update PRs for every ecosystem the repo ships.
#
# - Monthly, on the first of the month at 06:00 UTC, so routine updates
#   land as one predictable batch a month rather than a stream of PRs.
#   Security updates are not held to this schedule (see below).
# - cooldown: a release must be 14 days old before Dependabot proposes
#   it. Brand-new releases are where hijacked or broken versions are
#   caught and yanked; the same two-week floor applies to hand-picked
#   pins (action SHAs, base-image digests).
# - Minor and patch updates are grouped into one PR per ecosystem;
#   majors arrive as separate PRs (one per directory), because they are
#   where breaking changes live and each needs its own review.
# - Commit messages follow the repo's conventional-commit rule:
#   "chore(deps): ..." ("chore(deps-dev): ..." for development
#   dependencies).
# - Branch moves stay manual, because each one moves several pins
#   together or needs a migration: nginx and Go minor and major
#   versions (nginx's odd minors are mainline releases; a Go version
#   moves with go.mod, CI's setup-go and the compose dev images), and
#   Node (with @types/node), Postgres and NATS majors (a Postgres major
#   needs a data migration).
#
# Security updates are not subject to the cooldown and arrive as soon
# as an advisory is published (Dependabot security updates are enabled
# in the repository settings).
#
# Not covered: the Trivy image pinned in release.yml's scan step and
# the image tags in the Helm chart's values; bump those by hand.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker
    directories:
      - "/api"
      - "/ingestion"
      - "/workers"
      - "/dashboard"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: "/docker"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      docker-compose-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: golang
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: nats
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: gomod
    directories:
      - "/api"
      - "/ingestion"
      - "/workers"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    # @types/node describes one Node major's API, so it moves with the
    # Node the dashboard runs on (node:24 in its Dockerfile, engines
    # >=24.15, CI's setup-node 24), as a manual branch move like Node
    # itself. Minor and patch updates within that major still arrive.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
    commit-message:
      prefix: chore
      include: scope

  # uv, not pip: the sensor's CI installs come from sensor/uv.lock, which
  # this ecosystem keeps in step with pyproject.toml.
  - package-ecosystem: uv
    directory: "/sensor"
    schedule:
      interval: monthly
      time: "06:00"
    cooldown:
      default-days: 14
    groups:
      uv-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore
      include: scope
