name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Workflow-level least privilege: read-only by default. The two jobs
# that need wider scope override at the job level — publish-sensor
# (id-token: write for OIDC trusted PyPI publish), github-release
# (contents: write to create the release). publish-docker uses
# Docker Hub credentials from secrets and pushes images out to a
# third-party registry; it never needs the GITHUB_TOKEN's write
# scope, so leaving it on the workflow default closes the
# supply-chain gap a future compromised action in that job's step
# sequence would otherwise widen.
permissions:
  contents: read

jobs:
  # Gate before anything is published: build the four images without
  # pushing and scan them. The release fails on any HIGH or CRITICAL
  # vulnerability that has a fixed version available (--ignore-unfixed:
  # an unfixable finding cannot be acted on by bumping) and on a base
  # image whose OS has reached end of life (--exit-on-eol). Trivy runs
  # from its official image pinned by digest rather than through a
  # third-party action; Dependabot does not see a pin inside a run:
  # script, so bump it by hand. publish-sensor waits for this job, so a
  # failing scan publishes nothing to PyPI or Docker Hub. publish-docker
  # rebuilds the images from the same commit minutes later rather than
  # reusing these.
  scan-images:
    name: Scan Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Nothing is built or published unless the tag matches the VERSION
      # file and every file that carries the version (scripts/version.py),
      # so a tag pushed before the release PR merged stops here.
      - name: Tag matches VERSION
        run: python3 scripts/version.py check --tag "${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # pricing.yaml is the canonical source of truth at the repo root.
      # api/Dockerfile bakes it into the image at
      # /etc/flightdeck/pricing.yaml via `COPY pricing.yaml ...`, which
      # resolves relative to the Docker build context. The context
      # below is ./api, so stage the file into the context without
      # relocating the source of truth or broadening the context to
      # the whole repo. The runner's working tree is ephemeral, so the
      # staged copy is discarded at the end of the job.
      - name: Stage pricing.yaml into api build context
        run: cp pricing.yaml api/pricing.yaml

      - name: Build ingestion
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./ingestion
          load: true
          tags: flightdeck-ingestion:scan

      - name: Build workers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./workers
          load: true
          tags: flightdeck-workers:scan

      - name: Build api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./api
          load: true
          tags: flightdeck-api:scan

      - name: Build dashboard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./dashboard
          load: true
          tags: flightdeck-dashboard:scan

      - name: Scan images
        # Scans every image before failing, so one run reports all
        # findings. The trivy-cache volume keeps the vulnerability DB
        # from being downloaded once per image.
        run: |
          failed=""
          for image in ingestion workers api dashboard; do
            echo "::group::flightdeck-$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v trivy-cache:/root/.cache \
              aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
              image --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --exit-on-eol 1 "flightdeck-$image:scan" \
              || failed="$failed $image"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::Image scan failed for:$failed"
            exit 1
          fi

  publish-sensor:
    name: Publish flightdeck-sensor to PyPI
    runs-on: ubuntu-24.04
    needs: scan-images
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        working-directory: sensor
        run: python -m build

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: sensor/dist/
          # Idempotent publish: if a workflow re-run targets the same
          # tag (e.g. retrying a release after a downstream Docker
          # build failure) the version already exists on PyPI and
          # would otherwise hard-fail the job. ``skip-existing: true``
          # turns that into a no-op so publish-docker and
          # github-release can still execute on the rerun.
          skip-existing: true

  publish-docker:
    name: Build and push Docker images
    runs-on: ubuntu-24.04
    needs: publish-sensor
    # Declaring an environment causes GitHub to record a Deployment
    # for this job, which surfaces it in the repo Deployments panel
    # alongside the ``pypi`` deployment created by publish-sensor.
    # Without this block the four Docker Hub publishes are invisible
    # to anyone scanning the panel for "where did v0.2.0 ship?". One
    # environment covers all four images because they all push to the
    # same flightdeckhq Docker Hub namespace from the same job.
    environment:
      name: docker-hub
      url: https://hub.docker.com/u/flightdeckhq
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push ingestion
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./ingestion
          push: true
          tags: |
            flightdeckhq/flightdeck-ingestion:${{ steps.version.outputs.VERSION }}
            flightdeckhq/flightdeck-ingestion:latest

      - name: Build and push workers
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./workers
          push: true
          tags: |
            flightdeckhq/flightdeck-workers:${{ steps.version.outputs.VERSION }}
            flightdeckhq/flightdeck-workers:latest

      # pricing.yaml is the canonical source of truth at the repo root.
      # api/Dockerfile bakes it into the image at
      # /etc/flightdeck/pricing.yaml via `COPY pricing.yaml ...`, which
      # resolves relative to the Docker build context. The context
      # below is ./api, so stage the file into the context without
      # relocating the source of truth or broadening the context to
      # the whole repo. The runner's working tree is ephemeral, so the
      # staged copy is discarded at the end of the job.
      - name: Stage pricing.yaml into api build context
        run: cp pricing.yaml api/pricing.yaml

      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./api
          push: true
          tags: |
            flightdeckhq/flightdeck-api:${{ steps.version.outputs.VERSION }}
            flightdeckhq/flightdeck-api:latest

      - name: Build and push dashboard
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ./dashboard
          push: true
          tags: |
            flightdeckhq/flightdeck-dashboard:${{ steps.version.outputs.VERSION }}
            flightdeckhq/flightdeck-dashboard:latest

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [publish-sensor, publish-docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Create release with auto-generated notes
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
