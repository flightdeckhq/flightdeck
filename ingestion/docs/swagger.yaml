components:
  schemas:
    handlers.DirectiveResponse:
      properties:
        action:
          type: string
        degrade_to:
          type: string
        grace_period_ms:
          type: integer
        id:
          type: string
        payload:
          type: object
        reason:
          type: string
      type: object
    handlers.ErrorResponse:
      properties:
        error:
          type: string
      type: object
    handlers.EventResponse:
      properties:
        attached:
          type: boolean
        directive:
          $ref: '#/components/schemas/handlers.DirectiveResponse'
        status:
          type: string
      type: object
    handlers.OTLPExportLogsResponse:
      properties:
        partialSuccess:
          $ref: '#/components/schemas/handlers.OTLPLogsPartialSuccess'
      type: object
    handlers.OTLPExportMetricsResponse:
      properties:
        partialSuccess:
          $ref: '#/components/schemas/handlers.OTLPMetricsPartialSuccess'
      type: object
    handlers.OTLPExportTraceResponse:
      properties:
        partialSuccess:
          $ref: '#/components/schemas/handlers.OTLPTracePartialSuccess'
      type: object
    handlers.OTLPLogsPartialSuccess:
      properties:
        errorMessage:
          type: string
        rejectedLogRecords:
          example: "3"
          type: string
      type: object
    handlers.OTLPMetricsPartialSuccess:
      properties:
        errorMessage:
          type: string
        rejectedDataPoints:
          example: "8"
          type: string
      type: object
    handlers.OTLPStatus:
      properties:
        code:
          type: integer
        message:
          type: string
      type: object
    handlers.OTLPTracePartialSuccess:
      properties:
        errorMessage:
          type: string
        rejectedSpans:
          example: "2"
          type: string
      type: object
externalDocs:
  description: ""
  url: ""
info:
  description: Receives sensor events and delivers directives to agents
  title: Flightdeck Ingestion API
  version: 0.8.0
openapi: 3.1.0
paths:
  /health:
    get:
      description: Returns service health status
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
          description: OK
      summary: Health check
      tags:
      - health
  /v1/events:
    post:
      description: Validates bearer token, publishes event to NATS, returns directive
        envelope. On session_start events, also reports whether the session was attached
        to a pre-existing row.
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: event
              type: object
        description: Event payload
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.EventResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      summary: Submit agent event
      tags:
      - events
  /v1/heartbeat:
    post:
      description: Validates bearer token, publishes heartbeat to NATS, returns directive
        envelope
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          text/plain:
            schema:
              title: heartbeat
              type: object
        description: Heartbeat payload with session_id
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                type: object
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.ErrorResponse'
          description: Internal Server Error
      summary: Agent heartbeat
      tags:
      - heartbeat
  /v1/logs:
    post:
      description: 'OTLP/HTTP logs receiver. Accepts an ExportLogsServiceRequest as
        protobuf (application/x-protobuf) or OTLP JSON (application/json), optionally
        gzip-compressed (Content-Encoding: gzip). Answers 200 with an ExportLogsServiceResponse
        in the request''s encoding whenever the body decodes; partialSuccess counts
        the log records Flightdeck did not map, with a message naming why. Error responses
        carry a google.rpc.Status in the request''s encoding. The request is refused
        with 429 before it is read when the token''s per-minute budget is spent; its
        mapped events are charged one unit each before they are published (429 when
        they do not fit in what is left, 413 when they exceed the whole budget). Inflating
        and decoding run under a global limit of concurrent decodes (503 with Retry-After
        when none is free).'
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        schema:
          type: string
      - description: gzip, or absent for an uncompressed body
        in: header
        name: Content-Encoding
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
          application/x-protobuf:
            schema:
              type: string
          text/plain:
            schema:
              title: request
              type: object
        description: OTLP ExportLogsServiceRequest
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPExportLogsResponse'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPExportLogsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: body does not decode
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: missing or invalid bearer token
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: body over 4 MiB, over 16 MiB decompressed, past the decode
            memory limit, or mapping to more events than the token's minute budget
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: media type or content encoding not supported
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: token's minute budget spent, or too little of it left for the
            request's events; see Retry-After
          headers:
            Retry-After:
              description: seconds until the token's minute budget has room
              schema:
                type: integer
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: token validation failed
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: no decode slot free (see Retry-After), or publishing the mapped
            events failed; retry
          headers:
            Retry-After:
              description: seconds to wait when no decode slot was free
              schema:
                type: integer
      summary: Export OTLP logs
      tags:
      - otlp
