name: Install gate

# The from-scratch install gate: on fresh runners of every supported
# platform, install flightdeck through the channel under test, start it,
# and check that it serves health, prints its token, accepts one
# sensor-shaped event, lists the session and serves the dashboard
# (scripts/install-gate.sh). Every step fails the leg.
#
# Runs when the Release workflow finishes on a tag (the artifacts it
# published are what is installed) and by hand with a tag, including a
# pre-release tag from a dry run (RELEASING.md). On a pre-release the
# Homebrew leg installs through install.sh instead, since the formula is
# published for stable tags only.
#
# Legs (RELEASING.md lists what each proves):
#   ubuntu-24.04      amd64  install.sh (the curl | sh path), pip + uvx, docker run
#   ubuntu-24.04-arm  arm64  install.sh
#   macos-14          arm64  brew install flightdeckhq/tap/flightdeck
#   macos-15-intel    amd64  install.sh
#   windows-2022      amd64  install.ps1 (the irm | iex path, the .zip)
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (vX.Y.Z or vX.Y.Z-rc.N), already published"
        required: true
        type: string

permissions:
  contents: read

env:
  # The binary needs a Postgres until the SQLite default lands (the
  # B-track of the single-binary design); each leg then starts one and
  # passes FLIGHTDECK_DATABASE_URL. Flip to "false" when `flightdeck`
  # runs with no database, and the legs run it bare.
  GATE_NEEDS_POSTGRES: "true"
  GATE_LISTEN: 127.0.0.1:4000

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-24.04
    # A failed release publishes nothing to install.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      pep440: ${{ steps.tag.outputs.pep440 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, pre-release flag and PEP 440 version
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          # For a tag push, workflow_run's head_branch is the tag name.
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          # The release tag grammar (scripts/version.py, build_wheels.py).
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          pep440="$(python3 -c 'import sys; sys.path.insert(0, "packaging/pypi"); import build_wheels; print(build_wheels.pep440_version(sys.argv[1]))' "$tag")"
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "pep440=$pep440"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Gate on $tag (pre-release: $prerelease, PyPI version $pep440)"

  linux:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64 (install.sh, pip, uvx, docker)
            runner: ubuntu-24.04
            extras: true
          - name: linux-arm64 (install.sh)
            runner: ubuntu-24.04-arm
            extras: false
    services:
      postgres:
        # Pinned by digest, as the dev stack's and CI's are not: the gate
        # must fail on the binary, never on a base-image change.
        image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
        env:
          POSTGRES_USER: flightdeck
          POSTGRES_PASSWORD: flightdeck_gate
          POSTGRES_DB: flightdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightdeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag under test: its install scripts and gate checks, not
          # the default branch's.
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: Database for the binary
        if: env.GATE_NEEDS_POSTGRES == 'true'
        run: |
          echo "FLIGHTDECK_DATABASE_URL=postgres://flightdeck:flightdeck_gate@127.0.0.1:5432/flightdeck?sslmode=disable" >> "$GITHUB_ENV"
          echo "GATE_DOCKER_DATABASE_URL=postgres://flightdeck:flightdeck_gate@host.docker.internal:5432/flightdeck?sslmode=disable" >> "$GITHUB_ENV"

      # cosign on the runner, so install.sh verifies the signature of
      # checksums.txt as a user with cosign would; the step fails when
      # the installer reports the check was skipped.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # The installer as users run it, piped from the raw URL of the tag
      # (what main serves once the tag's commit is on main).
      - name: install.sh (curl | sh)
        run: |
          test ! -e /usr/local/bin/flightdeck
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" | VERSION="$TAG" sh | tee "$RUNNER_TEMP/install.log"
          grep -q 'Signature of checksums.txt verified' "$RUNNER_TEMP/install.log"
          command -v flightdeck
          flightdeck --version

      - name: Gate (install.sh binary)
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run "$GATE_LISTEN" "$(command -v flightdeck)"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        if: matrix.extras
        with:
          python-version: "3.12"

      # PyPI's index can lag the upload by a minute or two.
      - name: pip install flightdeck-cli
        if: matrix.extras
        env:
          PEP440: ${{ needs.resolve.outputs.pep440 }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for i in $(seq 1 20); do
            if "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir "flightdeck-cli==$PEP440"; then break; fi
            [ "$i" -lt 20 ] || { echo "::error::flightdeck-cli==$PEP440 not installable from PyPI after 10 minutes"; exit 1; }
            sleep 30
          done
          "$RUNNER_TEMP/venv/bin/flightdeck" --version | grep -qx "flightdeck $TAG"
          "$RUNNER_TEMP/venv/bin/flightdeck-cli" --version | grep -qx "flightdeck $TAG"

      - name: Gate (pip binary)
        if: matrix.extras
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run 127.0.0.1:4001 "$RUNNER_TEMP/venv/bin/flightdeck"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: matrix.extras

      - name: uvx flightdeck-cli
        if: matrix.extras
        env:
          PEP440: ${{ needs.resolve.outputs.pep440 }}
        run: |
          uvx --from "flightdeck-cli==$PEP440" flightdeck-cli --version | grep -qx "flightdeck $TAG"
          uvx --from "flightdeck-cli==$PEP440" flightdeck --version | grep -qx "flightdeck $TAG"

      - name: docker run flightdeckhq/flightdeck
        if: matrix.extras
        run: |
          docker pull "flightdeckhq/flightdeck:$TAG"
          docker run --rm "flightdeckhq/flightdeck:$TAG" --version | grep -qx "flightdeck $TAG"
          docker run -d --name flightdeck --add-host=host.docker.internal:host-gateway \
            -p 127.0.0.1:4002:4000 -v flightdeck-gate:/data \
            ${GATE_DOCKER_DATABASE_URL:+-e FLIGHTDECK_DATABASE_URL="$GATE_DOCKER_DATABASE_URL"} \
            "flightdeckhq/flightdeck:$TAG"

      - name: Gate (container)
        if: matrix.extras
        run: scripts/install-gate.sh check http://127.0.0.1:4002 docker logs flightdeck

      - name: Container stops cleanly
        if: matrix.extras
        run: |
          docker stop -t 30 flightdeck
          test "$(docker inspect flightdeck --format '{{.State.ExitCode}}')" = "0"
          docker rm flightdeck

  macos:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64 (brew)
            runner: macos-14
            channel: brew
          - name: macos-amd64 (install.sh)
            runner: macos-15-intel
            channel: install.sh
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag under test: its install scripts and gate checks, not
          # the default branch's.
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      # The macOS runner images ship no PostgreSQL; Homebrew's is a
      # minute to install. Local connections are trusted for the runner
      # user, who owns the cluster brew creates.
      - name: Database for the binary
        if: env.GATE_NEEDS_POSTGRES == 'true'
        run: |
          brew install postgresql@16
          brew services start postgresql@16
          PGBIN="$(brew --prefix postgresql@16)/bin"
          for _ in $(seq 1 60); do "$PGBIN/pg_isready" -h 127.0.0.1 -q && break; sleep 1; done
          "$PGBIN/pg_isready" -h 127.0.0.1
          "$PGBIN/createdb" -h 127.0.0.1 flightdeck
          echo "FLIGHTDECK_DATABASE_URL=postgres://$(whoami)@127.0.0.1:5432/flightdeck?sslmode=disable" >> "$GITHUB_ENV"

      - name: brew install flightdeckhq/tap/flightdeck
        if: matrix.channel == 'brew' && env.PRERELEASE == 'false'
        run: |
          brew install flightdeckhq/tap/flightdeck
          brew test flightdeck
          echo "FLIGHTDECK_BIN=$(brew --prefix)/bin/flightdeck" >> "$GITHUB_ENV"

      - name: install.sh (curl | sh)
        if: matrix.channel == 'install.sh' || env.PRERELEASE == 'true'
        run: |
          if [ "${{ matrix.channel }}" = brew ]; then
            echo "::warning::$TAG is a pre-release, which the tap does not carry; this leg installs with install.sh"
          fi
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" | VERSION="$TAG" sh
          echo "FLIGHTDECK_BIN=$(command -v flightdeck)" >> "$GITHUB_ENV"

      - name: Gate
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run "$GATE_LISTEN" "$FLIGHTDECK_BIN"

      # brew services runs the binary with its defaults (loopback :4000,
      # ~/.flightdeck): it must come up and log its start-up block.
      - name: brew services start flightdeck
        if: matrix.channel == 'brew' && env.PRERELEASE == 'false'
        run: |
          brew services start flightdeck
          for _ in $(seq 1 60); do curl -sf -o /dev/null "http://$GATE_LISTEN/ingest/health" && break; sleep 1; done
          curl -sf "http://$GATE_LISTEN/api/health"
          grep -q '^Flightdeck ' "$(brew --prefix)/var/log/flightdeck.log"
          brew services stop flightdeck

  windows:
    name: windows-amd64 (install.ps1)
    needs: resolve
    runs-on: windows-2022
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag under test: its install scripts and gate checks, not
          # the default branch's.
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      # The runner image ships PostgreSQL as a stopped Windows service
      # with PGBIN, PGUSER=postgres and PGPASSWORD=root in the environment.
      - name: Database for the binary
        if: env.GATE_NEEDS_POSTGRES == 'true'
        shell: pwsh
        run: |
          $svc = Get-Service -Name 'postgresql*' | Select-Object -First 1
          if (-not $svc) { throw 'no PostgreSQL service on this runner image' }
          Set-Service -Name $svc.Name -StartupType Manual
          Start-Service -Name $svc.Name
          $ready = $false
          for ($i = 0; $i -lt 60 -and -not $ready; $i++) {
            & "$env:PGBIN\pg_isready.exe" -h 127.0.0.1 | Out-Null
            if ($LASTEXITCODE -eq 0) { $ready = $true } else { Start-Sleep 1 }
          }
          if (-not $ready) { throw 'PostgreSQL did not become ready' }
          # The image's superuser, as its PostgreSQL install documents them.
          $user = if ($env:PGUSER) { $env:PGUSER } else { 'postgres' }
          $password = if ($env:PGPASSWORD) { $env:PGPASSWORD } else { 'root' }
          $env:PGPASSWORD = $password
          & "$env:PGBIN\createdb.exe" -h 127.0.0.1 -U $user flightdeck
          if ($LASTEXITCODE -ne 0) { throw 'createdb failed' }
          "FLIGHTDECK_DATABASE_URL=postgres://${user}:${password}@127.0.0.1:5432/flightdeck?sslmode=disable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The installer as users run it, piped from the raw URL of the tag.
      # It appends its directory to GITHUB_PATH.
      # cosign on the runner, so install.ps1 takes its signature-check
      # path (the one that reads cosign's stderr) on every gate run.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # PSScriptAnalyzer ships on the Windows runner image; the installer
      # is linted on the platform that runs it.
      - name: PSScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings) { throw "PSScriptAnalyzer: $($findings.Count) finding(s) in install.ps1" }

      - name: install.ps1 (irm | iex)
        shell: pwsh
        env:
          VERSION: ${{ env.TAG }}
        run: |
          $out = irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:TAG/install.ps1" | iex *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Signature of checksums.txt verified') { throw 'install.ps1 did not verify the signature of checksums.txt' }

      - name: flightdeck --version
        shell: pwsh
        run: |
          $printed = flightdeck --version
          if ($printed -ne "flightdeck $env:TAG") { throw "printed '$printed', want 'flightdeck $env:TAG'" }

      - name: Gate
        shell: bash
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run "$GATE_LISTEN" "$(command -v flightdeck)"
