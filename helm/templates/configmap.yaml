apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flightdeck.configMapName" . }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "shared") | nindent 4 }}
data:
  # The binary's tunables (ARCHITECTURE.md, Deployment); the database
  # and bus URLs live in the Secret.
  FLIGHTDECK_WORKER_POOL_SIZE: {{ .Values.flightdeck.workerPoolSize | quote }}
  FLIGHTDECK_RATE_LIMIT_PER_MINUTE: {{ .Values.flightdeck.rateLimitPerMinute | quote }}
  SHUTDOWN_TIMEOUT_SECS: {{ .Values.flightdeck.shutdownTimeoutSecs | quote }}
  {{- if .Values.flightdeck.corsOrigin }}
  FLIGHTDECK_CORS_ORIGIN: {{ .Values.flightdeck.corsOrigin | quote }}
  {{- end }}
  # The FLIGHTDECK stream's settings; the binary applies them at startup
  # to the embedded bus or to the shared NATS cluster.
  FLIGHTDECK_NATS_STREAM_MAX_AGE_HOURS: {{ include "flightdeck.natsStreamMaxAgeHours" . | quote }}
  FLIGHTDECK_NATS_STREAM_MAX_SIZE_MIB: {{ include "flightdeck.natsStreamMaxSizeMiB" . | quote }}
  FLIGHTDECK_NATS_STREAM_REPLICAS: {{ include "flightdeck.natsStreamReplicas" . | quote }}
  {{- range $name, $value := .Values.flightdeck.extraEnv }}
  {{ $name }}: {{ $value | quote }}
  {{- end }}
  # Agent-side defaults -- consumed only if an operator wires them into an
  # agent deployment. The binary ignores these.
  AGENT_FLAVOR: {{ .Values.flightdeck.agents.flavor | quote }}
  AGENT_TYPE: {{ .Values.flightdeck.agents.type | quote }}
  FLIGHTDECK_UNAVAILABLE_POLICY: {{ .Values.flightdeck.agents.unavailablePolicy | quote }}
  FLIGHTDECK_CAPTURE_PROMPTS: {{ .Values.flightdeck.agents.capturePrompts | quote }}
