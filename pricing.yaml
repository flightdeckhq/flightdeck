# Flightdeck model pricing table.
#
# Prices are USD per 1,000,000 tokens, taken from provider public list
# prices at the standard tier. Last verified: 2026-10-18 against
# platform.claude.com (pricing, model lifecycle), developers.openai.com
# (pricing, deprecations) and ai.google.dev (pricing, models).
#
# To add or update an entry: see CONTRIBUTING.md ("Updating pricing
# data"). Include a link to the provider's pricing page in your PR.
#
# Scope of this table (what the cost formula can express today):
#   * One input rate and one output rate per model. Tiered prices
#     (prompt-size tiers, long-context surcharges), batch / flex / fast
#     service tiers, data-residency multipliers and per-call server-tool
#     fees are not representable; the standard, short-context, standard-
#     speed rate is recorded and the tier is noted where it exists.
#   * Cache ratios are uniform constants in api/internal/store/pricing.go:
#       cache_read     = input * 0.10
#       cache_creation = input * 1.25
#     They match Anthropic's 5-minute cache on most models. They are
#     wrong for one-hour cache writes (2x), for Claude Opus 5.5 /
#     Sonnet 5.5 cache reads (0.05x), for Claude Fable 5.1 / Mythos 5.1
#     cache reads (0.025x), and for OpenAI (model-dependent cached-input
#     rates, cache writes charged on GPT-5.6 and later). Per-model ratios
#     require the richer pricing model tracked on the README Roadmap.
#   * Retired model ids stay in the table so historical sessions keep a
#     cost; they are marked in `notes`.
#
# `provider` must be one of: anthropic, openai, google, xai, mistral,
# meta, other. `input` and `output` must be >= 0. `model_id` is the
# exact string the sensor emits on events.model (dated snapshot ids and
# undated aliases are separate rows). Duplicates are rejected at load
# time.

