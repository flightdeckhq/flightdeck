{{- if .Values.nats.enabled -}}
{{- $component := "nats" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ include "flightdeck.natsServiceName" . }}
  replicas: {{ .Values.nats.replicas }}
  {{- if gt (int .Values.nats.replicas) 1 }}
  # A clustered JetStream server is not healthy until it reaches its
  # peers, so the pods start together rather than one at a time (the
  # default ordered start would wait on pod 0 forever). A single server
  # keeps the default, so a one-replica install upgrades in place (the
  # field cannot change on an existing StatefulSet).
  podManagementPolicy: Parallel
  {{- end }}
  selector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      {{- with .Values.nats.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "flightdeck.serviceAccountName" (dict "root" . "component" $component) }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: nats
          image: "{{ .Values.image.registry }}/{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # JetStream enabled via CLI flag so NATS works without a config
          # file. Matches docker/docker-compose.yml behaviour.
          args:
            - "--jetstream"
            - "--store_dir"
            - "/data"
            - "--http_port"
            - "{{ .Values.nats.monitorPort }}"
            - "--port"
            - "{{ .Values.nats.clientPort }}"
            - "--name"
            - "$(POD_NAME)"
            {{- if gt (int .Values.nats.replicas) 1 }}
            - "--cluster_name"
            - {{ include "flightdeck.natsServiceName" . | quote }}
            # With a token set, routes authenticate with it too, so the
            # cluster port is not a way around client auth.
            - "--cluster"
            - "nats://{{ include "flightdeck.natsRouteAuth" . }}0.0.0.0:{{ .Values.nats.clusterPort }}"
            - "--routes"
            - {{ include "flightdeck.natsRoutes" . | quote }}
            {{- end }}
            {{- if .Values.nats.auth.token }}
            - "--auth"
            - "$(NATS_TOKEN)"
            {{- end }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if .Values.nats.auth.token }}
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightdeck.secretName" . }}
                  key: FLIGHTDECK_NATS_TOKEN
            {{- end }}
          ports:
            - name: client
              containerPort: {{ .Values.nats.clientPort }}
              protocol: TCP
            - name: monitor
              containerPort: {{ .Values.nats.monitorPort }}
              protocol: TCP
            - name: cluster
              containerPort: {{ .Values.nats.clusterPort }}
              protocol: TCP
          # Full health (JetStream meta layer included) gates startup, with
          # room for the cluster to form and recover its streams; after
          # that readiness asks only whether this server accepts clients
          # and liveness whether JetStream is enabled, so one slow peer
          # does not restart or unready the others.
          startupProbe:
            httpGet:
              path: /healthz
              port: monitor
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitor
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.nats.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      {{- with .Values.nats.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nats.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nats.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.nats.jetstream.fileStore.storageClassName }}
        storageClassName: {{ .Values.nats.jetstream.fileStore.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.nats.jetstream.fileStore.size }}
{{- end }}
