name: Release

# A version tag builds the flightdeck binary for every platform and
# publishes it through every channel: GitHub release archives with
# checksums and the Homebrew formula (goreleaser), the flightdeck-sensor
# and flightdeck-cli packages on PyPI, and the all-in-one Docker image.
# The install gate (install-gate.yml) runs on this workflow's completion
# and installs from each channel on fresh runners.
#
# Tags: vX.Y.Z is a release; vX.Y.Z-<pre-release> (v0.9.0-rc.1) is a dry
# run of the same pipeline: a GitHub pre-release, no Homebrew formula,
# no `latest` image tag, no flightdeck-sensor publish (its version would
# be the final X.Y.Z), flightdeck-cli as a PEP 440 pre-release that pip
# does not pick by default. RELEASING.md has the sequence.
on:
  push:
    tags:
      - "v*"

# Workflow-level least privilege: read-only by default. The jobs that
# need more say so: goreleaser (contents: write for the release and its
# assets, id-token: write for the keyless signature of checksums.txt),
# the two PyPI jobs (id-token: write for trusted publishing). The Docker
# job pushes with Docker Hub credentials from secrets and never needs the
# GITHUB_TOKEN's write scope. No checkout persists its token in
# .git/config: `npm ci` runs package lifecycle scripts in the goreleaser
# job, and goreleaser takes GITHUB_TOKEN from the environment.
permissions:
  contents: read

env:
  # goreleaser is pinned here and in ci.yml's release-snapshot job: the
  # release must build what CI built.
  GORELEASER_VERSION: v2.20.0

jobs:
  # Nothing is built or published unless the tag names the version every
  # file carries (scripts/version.py), and the Go modules have no known
  # vulnerability. A tag pushed before the release PR merged stops here.
  verify:
    name: Tag matches VERSION, govulncheck
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches VERSION
        id: tag
        run: |
          python3 scripts/version.py check --tag "$GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "::notice::$GITHUB_REF_NAME is a pre-release: a dry run of the pipeline" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.sum
            go.work.sum
            ingestion/go.sum
            workers/go.sum
            api/go.sum
            storage/go.sum

      # govulncheck reports only vulnerabilities in code the binaries
      # reach, module by module. The root module names its packages
      # instead of ./... so dashboard/node_modules is not walked. Pinned
      # to a commit (golang/vuln v1.9.0): a tag can be re-pointed.
      - name: govulncheck (root module and the service modules)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@d1f380186385b4f64e00313f31743df8e4b89a77
          govulncheck . ./cmd/... ./internal/... ./webui/...
          for m in api ingestion workers storage; do
            echo "::group::$m"
            (cd "$m" && govulncheck ./...)
            echo "::endgroup::"
          done

  # The dashboard bundle, built in a job of its own with read-only
  # permissions: `npm ci` runs the packages' lifecycle scripts, and a
  # compromised dependency must find neither the release token nor an
  # OIDC token it could sign checksums.txt with. The bundle crosses to
  # the goreleaser job as an artifact.
  webui:
    name: Dashboard bundle
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build the bundle into webui/dist
        run: |
          make build-webui
          test -f webui/dist/index.html

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: webui-dist
          path: webui/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # The six binaries, the archives and checksums on the GitHub release,
  # the Homebrew formula in flightdeckhq/homebrew-tap (stable tags only;
  # .goreleaser.yaml). This job runs goreleaser and cosign only: no
  # package manager, no third-party build step, with the two write
  # scopes the release needs. The binaries are kept as a workflow
  # artifact for the PyPI wheels.
  goreleaser:
    name: Binaries, GitHub release, Homebrew formula
    runs-on: ubuntu-24.04
    needs: [verify, webui]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # goreleaser reads the tags and the commit for the version.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.sum
            go.work.sum
            ingestion/go.sum
            workers/go.sum
            api/go.sum
            storage/go.sum

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: webui-dist
          path: webui/dist

      - name: The bundle is in place
        run: test -f webui/dist/index.html

      # The release notes are the tag's CHANGELOG section (the
      # Unreleased section for a pre-release), written outside dist/,
      # which goreleaser --clean empties.
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" -o "$RUNNER_TEMP/release-notes.md"

      # cosign signs checksums.txt keyless (Sigstore) with this job's OIDC
      # identity; the bundle is uploaded beside it (.goreleaser.yaml).
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      - name: goreleaser release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          # --skip=before: the dashboard bundle came from the webui job,
          # so the `make build-webui` hook (which needs npm) is not run.
          args: release --clean --skip=before --release-notes "${{ runner.temp }}/release-notes.md"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A fine-grained token with contents: write on homebrew-tap;
          # the GITHUB_TOKEN cannot push to another repository. Unused
          # on a pre-release (the formula is skipped).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Keep the binaries for the PyPI wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binaries
          path: |
            dist/artifacts.json
            dist/flightdeck_*/flightdeck
            dist/flightdeck_*/flightdeck.exe
          if-no-files-found: error
          retention-days: 7

  publish-cli:
    name: Publish flightdeck-cli to PyPI
    runs-on: ubuntu-24.04
    needs: goreleaser
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: binaries
          path: dist

      # One wheel per platform from the binaries goreleaser built
      # (packaging/pypi/build_wheels.py); the version is the tag in its
      # PEP 440 form (v0.9.0-rc.1 -> 0.9.0rc1).
      # The zip timestamps are the tag's commit time, passed explicitly,
      # so the wheels are reproducible from the tag alone.
      - name: Build the wheels
        run: |
          chmod +x dist/flightdeck_*/flightdeck*
          python3 packaging/pypi/build_wheels.py --artifacts dist/artifacts.json \
            --tag "$GITHUB_REF_NAME" --out packaging/pypi/dist \
            --source-date-epoch "$(git log -1 --format=%ct "$GITHUB_REF_NAME")"
          ls -l packaging/pypi/dist

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: packaging/pypi/dist/
          # A re-run on the same tag finds the version already on PyPI;
          # skip it instead of failing the rest of the release.
          skip-existing: true

  publish-sensor:
    name: Publish flightdeck-sensor to PyPI
    runs-on: ubuntu-24.04
    # After the binaries and their wheels exist: nothing reaches PyPI
    # while the release itself can still fail, so a failed goreleaser
    # run leaves nothing published (RELEASING.md, "If a release fails").
    needs: [verify, publish-cli]
    # The sensor's version is the final X.Y.Z, so a pre-release tag
    # (a dry run) must not publish it.
    if: needs.verify.outputs.prerelease == 'false'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build wheel and sdist
        working-directory: sensor
        run: python -m build

      - name: Publish to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: sensor/dist/
          skip-existing: true

  # The all-in-one image, built from the root Dockerfile for linux/amd64
  # and linux/arm64. The Go cross-compile runs on the build platform and
  # the runtime stage has no RUN, so no emulation is set up. The amd64
  # image is scanned before anything is pushed: the release fails on a
  # HIGH or CRITICAL vulnerability with a fix available (--ignore-unfixed)
  # or an end-of-life base (--exit-on-eol). Trivy runs from its image
  # pinned by digest; Dependabot does not see a pin inside a run: script,
  # so bump it by hand.
  publish-docker:
    name: All-in-one image to Docker Hub
    runs-on: ubuntu-24.04
    needs: [verify, goreleaser]
    environment:
      name: docker-hub
      url: https://hub.docker.com/r/flightdeckhq/flightdeck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build linux/amd64 for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: flightdeck:scan
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Scan the image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --no-progress --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --exit-on-eol 1 flightdeck:scan

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tags
        id: tags
        run: |
          tags="flightdeckhq/flightdeck:${GITHUB_REF_NAME}"
          if [ "${{ needs.verify.outputs.prerelease }}" = "false" ]; then
            tags="$tags,flightdeckhq/flightdeck:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
