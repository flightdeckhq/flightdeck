{{- /*
Shared Secret: the database URL the pods read (external or bundled),
the bundled Postgres's own credentials, and the NATS token and URL when
the cluster is rendered. The pods' other secret, the dashboard token
and the JWT secret, is generated by the binary into /data/secrets.json.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flightdeck.secretName" . }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "shared") | nindent 4 }}
type: Opaque
stringData:
  FLIGHTDECK_DATABASE_URL: {{ include "flightdeck.postgresURL" . | quote }}
  {{- if not .Values.postgres.externalUrl }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ include "flightdeck.postgresPassword" . | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  {{- end }}
  {{- if include "flightdeck.natsEnabled" . }}
  FLIGHTDECK_NATS_TOKEN: {{ include "flightdeck.natsToken" . | quote }}
  FLIGHTDECK_NATS_URL: {{ include "flightdeck.natsURL" . | quote }}
  {{- end }}
