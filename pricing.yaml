    cache_write_1h: 1.60
    notes: Retired 2026-02-19

# ---------------------------------------------------------------------
# aliases: price a deployment or route name (an Azure deployment, a
# gateway's custom route) as a known model. Fields: alias, model_id,
# platform (default direct). An alias must not reuse a catalogue id.
#
#   - alias: prod-gpt4o
#     model_id: gpt-4o
#     platform: azure
# ---------------------------------------------------------------------
aliases: []

# ---------------------------------------------------------------------
# multipliers: applied to a call's cost by the value of a field the call
# reports. A value not listed multiplies by 1. These are the defaults;
# each value listed here replaces the default for that value only (set
# one to 1 to cancel it). Anthropic's fast mode is priced per model in
# the catalogue (fast_multiplier), not here.
# ---------------------------------------------------------------------
multipliers:
  service_tier:
    batch: 0.5
    flex: 0.5
  inference_geo:
    us: 1.1
  inference_scope:
    regional: 1.1

# ---------------------------------------------------------------------
# server_tools: USD per request, by server_tool_use counter.
# ---------------------------------------------------------------------
server_tools:
  web_search_requests: 0.01
