# The contributor dev stack's database: one Postgres container. `make
# dev` (scripts/dev-stack.sh) starts it and runs the `flightdeck` binary
# built from this checkout beside it, on the host, against it. Users do
# not run this file; they run docker-compose.yml.
#
# The compose project is `docker` (scripts/dev-stack.sh passes it, and
# it is what compose derives from this directory's name), so the
# container is `docker-postgres-1` and the volume `docker_postgres_data`:
# the names the test harness shells into (tests/shared/fixtures.py,
# scripts/go-db-tests.sh, three dashboard E2E files) and the volume
# every existing dev database already lives on.
#
# docker-compose.split.yml layers the three services as separate
# containers on this file, for the tests that pause the worker.

services:
  postgres:
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # FLIGHTDECK_POSTGRES_IMAGE / FLIGHTDECK_POSTGRES_DATA_DIR let CI run
    # the stack on another Postgres major; Postgres 18 images keep their
    # data under /var/lib/postgresql (the volume mounts there) instead of
    # /var/lib/postgresql/data.
    image: ${FLIGHTDECK_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flightdeck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flightdeck_dev}
      POSTGRES_DB: ${POSTGRES_DB:-flightdeck}
    volumes:
      - postgres_data:${FLIGHTDECK_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Loopback only: the database has a well-known development
      # password and must never be reachable from the LAN.
      # FLIGHTDECK_DEV_PG_PORT moves the host port for a second stack
      # beside a running one.
      - "127.0.0.1:${FLIGHTDECK_DEV_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flightdeck}"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
