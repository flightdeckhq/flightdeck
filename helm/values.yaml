# Default values for the flightdeck chart.
#
# The chart runs the one `flightdeck` binary (ingestion API, workers,
# query API and the dashboard in one process) as a StatefulSet. With
# the defaults that is all it runs: one pod, its database a SQLite file
# and its bus the embedded NATS, both on the pod's own volume.
#
#   helm install flightdeck helm/
#
# Postgres instead of SQLite: postgres.enabled=true with
# postgres.password (the chart's own single-instance Postgres), or
# postgres.externalUrl (one you run).
#
# More than one pod (flightdeck.replicas above 1, or the HPA) needs a
# database and a bus the pods share, and the render refuses anything
# else: a Postgres as above, and a NATS, which the chart then runs as a
# cluster (nats.auth.token required) unless nats.externalUrl names one.
# values.prod.yaml is that shape.
#
# Secrets. Every secret the chart needs (the database URL, the bundled
# Postgres's password, the NATS token, an external NATS URL) can come
# from a Secret you create instead of a value: the *Secret: {name, key}
# entries below. Then nothing secret sits in a values file or in the
# Helm release. Give one source for each, the value or the Secret; the
# render refuses both.
#
# image.tag is pinned to the release this chart ships with
# (scripts/version.py keeps it in step with the VERSION file).

# The resources are named <base>-<component>, the base being
# fullnameOverride, or the release name (with -<nameOverride or
# flightdeck> appended when it does not contain it), cut to 43
# characters so every name fits Kubernetes's limits.
nameOverride: ""
fullnameOverride: ""

# The cluster's DNS domain, for the in-cluster names the pods answer
# for (FLIGHTDECK_ALLOWED_HOSTS, below).
clusterDomain: cluster.local

# The chart refuses an upgrade that moves the release to another
# database (SQLite to Postgres, the chart's Postgres to an external one,
# one external Postgres to another) when it can see the change: the
# data is not moved, and the pods would start on an empty database.
# true lets such an upgrade go ahead. See "Changing the database" in
# the README.
allowDatabaseChange: false

image:
  registry: docker.io
  repository: flightdeckhq/flightdeck
  tag: "v0.8.0"
  # sha256:<64 hex digits> pins the image to that digest
  # (<repository>@<digest>; the tag is then not used). The NATS and
  # Postgres images take one too.
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

flightdeck:
  # Pods. Each pod is a whole control plane behind the one Service;
  # the Ingress and the Service spread requests over them. More than
  # one (or the HPA on) needs Postgres and a shared NATS, see the top
  # of this file; on SQLite each pod would have a database of its own,
  # so the render fails.
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # The one port: the dashboard at /, the query API under /api and the
  # ingestion API under /ingest.
  port: 4000
  service:
    type: ClusterIP
    port: 4000
  # --metrics: the three services' metrics listeners on their default
  # ports (workers 9102, ingestion 9103, query API 9104), declared on the
  # pod and listed on the headless <release>-flightdeck-metrics Service
  # for a scraper or a ServiceMonitor. They carry no auth, so they are
  # never on the Service the Ingress routes to.
  metrics:
    enabled: true
    # A NetworkPolicy on the flightdeck pods that lets the metrics ports
    # be reached only from the peers in `from` (NetworkPolicy peers: a
    # namespaceSelector, a podSelector, or both), and leaves the port
    # of the dashboard and the APIs open to everyone. Off by default,
    # since it needs a CNI that enforces NetworkPolicy and the peers of
    # your scraper; on, `from` must name at least one. Example:
    #   from:
    #     - namespaceSelector:
    #         matchLabels:
    #           kubernetes.io/metadata.name: monitoring
    networkPolicy:
      enabled: false
      from: []
  # Access-Control-Allow-Origin of the query API. Empty keeps the
  # binary's default ("*"); the dashboard is served from the same
  # origin, so the API needs no cross-origin caller. Set it to the
  # dashboard's origin (https://flightdeck.example.com) to refuse
  # browser calls from anywhere else.
  corsOrigin: ""
  # Events per minute each access token may send to one pod; the
  # sensor, the plugin and the OpenTelemetry exporters share a token's
  # budget.
  rateLimitPerMinute: 1000
  # Worker goroutines consuming the bus in each pod.
  workerPoolSize: 10
  shutdownTimeoutSecs: 30
  # Further FLIGHTDECK_* tunables (ARCHITECTURE.md, Deployment), as
  # name: value. They land in the ConfigMap, in plain text, so the
  # render refuses a name that reads like a secret, in any case: one
  # containing PASSWORD, PASSWD, SECRET, TOKEN, CREDENTIAL or APIKEY,
  # or with KEY, URL, URI, DSN, PASS or PWD as a word of it (a URL may
  # carry a password). That guards against a slip; it does not find a
  # secret under another name. Secrets come from the Secret values
  # above, or from a Secret of yours through extraEnvFrom, which also
  # takes a refused name that is no secret (a configMapRef). It also
  # refuses a name the chart sets itself, which would be a duplicate key.
  extraEnv: {}
  # More env sources for the flightdeck container, as envFrom entries
  # (secretRef or configMapRef). They come after the chart's ConfigMap
  # and Secret, so a key in them overrides the chart's, and the chart
  # does not see it: a FLIGHTDECK_DATABASE_URL here moves the pods to
  # that database past the upgrade check, a FLIGHTDECK_ALLOWED_HOSTS
  # replaces the chart's list. (The env entries the *Secret values set
  # are not overridden: env wins over envFrom.) Example:
  #   extraEnvFrom:
  #     - secretRef:
  #         name: flightdeck-extra
  extraEnvFrom: []
  # The dashboard token, from a Secret you created: the chart mounts the
  # key read-only as a file and points FLIGHTDECK_DASHBOARD_TOKEN_FILE
  # at it (never FLIGHTDECK_DASHBOARD_TOKEN, which would put it in the
  # pod's environment). Every pod then serves this one token, however
  # many there are, and it is known before the first start. It must be
  # "ftd_" and 32 random lower-case hex digits; a pod refuses to start
  # on anything else, which the chart cannot check:
  #   kubectl create secret generic flightdeck-dashboard-token \
  #     --from-literal=token="ftd_$(openssl rand -hex 16)"
  # Without it each pod mints a token of its own on its first start;
  # each is valid on every pod, since tokens are rows of the database
  # the pods share, and Settings lists one "Bootstrap token" per pod.
  # To rotate it: put the new token in the Secret, restart every pod
  # (kubectl rollout restart statefulset/<release>-flightdeck: the pods
  # read the file at start), then revoke the old one in Settings
  # ("Supplied dashboard token (ftd_xxxx)"). The old one stays valid
  # until then, so a pod not yet restarted keeps working; revoked
  # earlier, it is stored again by the next pod that starts with it.
  dashboardTokenSecret:
    name: ""
    key: token
  # Host names the binary answers for, besides the ones the chart lists
  # (FLIGHTDECK_ALLOWED_HOSTS): the Service and headless Service in
  # their short and qualified forms, every pod's DNS name, the Ingress
  # host and TLS hosts, and localhost. A request whose Host header names
  # anything else is refused with 421 by binaries that check it; IP
  # addresses, and so the kubelet's probes, are always answered. Add the
  # names other clients use (another Ingress, a LoadBalancer's DNS
  # name). A leading dot admits every name under one (.example.com);
  # "*" turns the check off.
  extraAllowedHosts: []
  # The volume of each pod, a PersistentVolumeClaim of its own, mounted
  # at /data; the binary's data dir is the directory `flightdeck` in it: the SQLite database when the database is SQLite, the embedded
  # NATS JetStream store when the pods share no bus, and secrets.json
  # (the dashboard token the pod minted). Sized for the embedded bus's
  # default 5 GiB stream limit beside a database of a few GiB; a pod on
  # Postgres and a shared NATS keeps only secrets.json here. The claim
  # outlives `helm uninstall` and scaling in (the StatefulSet's claim
  # retention policy says Retain for both): delete it to delete the
  # data. size and storageClassName are fixed once installed: a
  # StatefulSet's claim template cannot change, so an upgrade that
  # changes either fails. The README says how to grow the claims.
  data:
    size: "10Gi"
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Agent-side defaults, surfaced in the <release>-config ConfigMap for
  # operators who wire them into their agent deployments with envFrom.
  # The binary ignores them.
  agents:
    flavor: ""
    # ``coding`` or ``production``; another value makes
    # flightdeck_sensor.init() raise ConfigurationError.
    type: "production"
    unavailablePolicy: "continue"
    capturePrompts: false

# NetworkPolicy hardening: only the flightdeck pods may reach Postgres
# and the NATS cluster (see templates/networkpolicy.yaml). Requires a
# CNI that enforces NetworkPolicy; set false to disable.
networkPolicy:
  enabled: true

nats:
  # The NATS cluster the pods share through --nats-url. null (the
  # default) runs it exactly when the chart runs more than one flightdeck
  # replica or the HPA is on; true runs it for one replica too; false
  # never, and the render then refuses more than one replica unless
  # externalUrl is set.
  enabled: null
  # A NATS server with JetStream outside the chart, as the URL the pods
  # connect to (nats://<token>@host:4222). When set the chart renders
  # no NATS of its own and keeps the URL in the Secret. The stream
  # settings below still apply: the pods create or update the stream.
  externalUrl: ""
  # The same URL from a Secret you created, instead of externalUrl.
  externalUrlSecret:
    name: ""
    key: url
  image:
    repository: nats
    tag: "2.14.3-alpine"
    digest: ""
  # With more than one replica the servers form a NATS cluster over
  # clusterPort (routes between the StatefulSet pods), so a message
  # published on any server reaches a consumer on any other and
  # JetStream runs clustered.
  replicas: 3
  clientPort: 4222
  monitorPort: 8222
  clusterPort: 6222
  auth:
    # Client token for the event bus. Required whenever the cluster is
    # rendered: an unauthenticated bus lets any pod that can reach it
    # forge events or drain the queue. Set via
    # --set nats.auth.token=<strong-random-token>; letters, digits and
    # . _ ~ - only, since it is placed in NATS URLs (openssl rand -hex 32).
    # With replicas > 1 the cluster routes authenticate with it as well.
    # A token given here is in the chart's Secret, and the pods carry
    # checksum/secret, a SHA-256 of that Secret, as an annotation, so
    # whoever can read pods can test guesses against it: use a random
    # token, as above, or tokenSecret, which the checksum does not cover.
    token: ""
    # The token from a Secret you created, instead of token. The same
    # characters only: the chart cannot check a Secret's value, and
    # the pods place it in the NATS URL as it is.
    tokenSecret:
      name: ""
      key: token
  jetstream:
    fileStore:
      size: "10Gi"
      storageClassName: ""
    # The FLIGHTDECK stream that carries every event from ingestion to
    # the workers. The binary creates it with these settings, or updates
    # an existing stream to them in place, at startup. The stream keeps
    # a message until a limit removes it, processed or not, and at the
    # size limit removes the oldest: events the workers have not
    # processed are lost when the workers are down for longer than
    # maxAgeHours, or fall further behind than maxSizeMiB. The same two
    # limits apply to the embedded bus of a one-replica install.
    stream:
      # How long a message is kept. 72 hours lets the workers be down
      # from a Friday evening to a Monday morning without losing events.
      maxAgeHours: 72
      # The most the stream stores on each NATS server, in MiB. Every
      # server holds a full replica on its own fileStore volume, and a
      # NATS server without a configured store limit reserves at most
      # 75% of the volume's free space when it starts, so keep this
      # well under that: 5120 MiB (5 GiB) on the 10Gi default volume.
      # The render fails above 75% of fileStore.size.
      maxSizeMiB: 5120
      # Servers holding a copy of the stream. Empty: 3 when
      # nats.replicas is at least 3, otherwise 1. Set: 1 to 5 but not 2
      # (two copies stop the stream when either server is lost), at
      # most nats.replicas. Raising it on an existing install copies the
      # stream to the new servers in place. On the embedded bus the
      # stream has one copy and this stays unset; with externalUrl it is
      # 1 unless set.
      replicas: null
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  # false (the default): no Postgres; the pod keeps its data in a SQLite
  # file on its own volume. true: the chart runs a single-instance
  # Postgres StatefulSet, with no HA and no backups, and the pods use
  # it. Changing the database of an existing release rolls its pods
  # onto the new one and does not move the data: an install that
  # already has data in the chart's Postgres must keep this true, or
  # its pods start on an empty SQLite database (the Postgres volume
  # claim stays).
  enabled: false
  # A Postgres outside the chart, as a full DSN (e.g.
  # postgres://user:pass@host:5432/flightdeck?sslmode=require). When set
  # the pods read it from the generated Secret and the chart renders no
  # Postgres of its own, whatever `enabled` says. Percent-encode reserved
  # characters in the password (`@` as %40): the URL's user:password
  # part ends at the first `@`. Each flightdeck pod opens at most 80
  # connections, so the server needs max_connections of 80 per pod plus
  # what else connects, or a pooler in front; the chart cannot check it.
  externalUrl: ""
  # The same URL from a Secret you created, instead of externalUrl.
  externalUrlSecret:
    name: ""
    key: url
  # max_connections of the chart's own Postgres. Unset: 80 for every
  # flightdeck pod the chart may run (flightdeck.replicas, or the HPA's
  # maxReplicas) plus 20, which is 100 for one pod. A value below that
  # fails the render.
  maxConnections: null
  image:
    repository: postgres
    tag: "16.15-alpine"
    digest: ""
  user: flightdeck
  # Required with enabled: true (the bundled StatefulSet), here or in
  # passwordSecret: --set postgres.password=<strong-password>, or a
  # values file scoped to the install. The render fails without it
  # rather than defaulting to a well-known password every install would
  # share, and the chart does not generate one: a generated password
  # would change on every render by a tool that cannot read the
  # cluster (helm template, Argo CD), and roll the pods with a password
  # the database never had.
  #
  # A password given here is in the chart's Secret, and the pods carry
  # checksum/secret, a SHA-256 of that Secret, as an annotation, so
  # whoever can read pods can test guesses against it: use a random
  # password (openssl rand -hex 24), or passwordSecret, which the
  # checksum does not cover.
  #
  # Postgres takes the password only when it creates its database, on
  # the first start with an empty volume. Changing this value later
  # changes what the pods send, not what the database expects, and the
  # pods then fail to connect; the claim outlives an uninstall, so a
  # reinstall keeps the old password too. To rotate it, change it in
  # the database first (psql asks for the new one, so it stays off the
  # command line and out of the shell history), then here:
  #   kubectl -n <ns> exec -it <release>-postgres-0 -- \
  #     psql -U flightdeck -d flightdeck -c '\password flightdeck'
  #   helm upgrade ... --set postgres.password=<new>
  password: ""
  # The password from a Secret you created, instead of password. Use
  # letters, digits and - . _ ~ only (openssl rand -hex 24): the chart
  # cannot percent-encode a value it does not see, and the pods place
  # it in the database URL as it is.
  passwordSecret:
    name: ""
    key: password
  database: flightdeck
  port: 5432
  sslmode: disable
  storage:
    size: "20Gi"
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  # The OpenTelemetry receiver under /ingest accepts request bodies up
  # to 4 MiB; an ingress controller with a smaller default (ingress-nginx:
  # 1m) needs its body-size annotation raised, as values.prod.yaml does.
  annotations: {}
  host: flightdeck.local
  tls: []
  # Everything on one path: the binary routes /, /api and /ingest itself.
  pathType: Prefix

serviceAccount:
  # Per-component ServiceAccounts are always rendered. Roles/RoleBindings
  # are empty by default (no permissions granted) -- they exist as a
  # placeholder for operators who want to scope future permissions.
  create: true

# The image runs as distroless's nonroot user (uid 65532); fsGroup gives
# the pod's volume to its group so the binary can create its data dir
# there. fsGroupChangePolicy must stay OnRootMismatch: with the default
# (Always) the kubelet adds group read and write to every file on the
# volume at each mount, where the volume type supports it, and the
# binary refuses a secrets.json that is wider than 0600, so the pod
# would not start a second time. With OnRootMismatch the kubelet
# prepares the empty volume once and leaves what the binary writes
# alone. The runtime's default seccomp profile filters the system calls
# the binary may make. The bundled NATS and Postgres pods set their own
# images' users, with the same seccomp profile and fsGroup policy and a
# read-only root filesystem (Postgres with emptyDirs for its socket
# directory and /tmp).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The binary writes under /data/flightdeck, and SQLite's temporary
# files under /tmp (an emptyDir), so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
