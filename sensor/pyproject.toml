[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flightdeck-sensor"
version = "0.8.0"
description = "In-process agent observability sensor for Flightdeck"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Omri Arnon", email = "omri.arnon@gmail.com" },
]
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.10,<3",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/flightdeckhq/flightdeck"

[project.optional-dependencies]
# Floor 0.86: the lowest release carrying the resource layout the
# resource-level patch imports (anthropic.resources.messages.messages
# with parse, anthropic.lib.bedrock._beta_messages,
# anthropic.lib.vertex._beta_messages, the raw-response header); the
# layout canary test pins those paths and the matrix runs against
# 0.94.0. Keep in step with the floor in [project] dependencies below.
anthropic = ["anthropic>=0.86"]
openai = ["openai>=1.0", "tiktoken>=0.5"]
# litellm is a framework-level router that aggregates multiple
# underlying providers. Installing the extra pulls in litellm; the
# sensor's SensorLitellm wrapper then intercepts ``litellm.completion``
# / ``litellm.acompletion`` via module-level patching. The 1.83.0 floor
# keeps installs off 1.82.7 / 1.82.8, which were published with a
# compromised build on 2026-03-24 and later withdrawn.
litellm = ["litellm>=1.83.0"]
# Model Context Protocol (MCP) observability. The sensor's
# MCP interceptor patches ``mcp.client.session.ClientSession`` so any
# framework that uses the official Python ``mcp`` SDK (LangChain via
# langchain-mcp-adapters, LlamaIndex via llama-index-tools-mcp, CrewAI
# via mcpadapt, raw SDK callers) emits MCP_TOOL_CALL / MCP_TOOL_LIST /
# MCP_RESOURCE_* / MCP_PROMPT_* events transitively. Both SDK lines are
# supported: 1.x (CrewAI pins ~=1.28.1, langchain-mcp-adapters <2) and 2.x
# (llama-index-tools-mcp 0.6+, fastmcp 4, langchain[mcp]). The floor
# is 1.28 because CrewAI pins mcp~=1.28.1 (1.28.x only): a higher floor
# would make this extra uninstallable next to CrewAI. The interceptor
# imports the error class under either name and captures the server
# fingerprint from 2.x's ``adopt`` handshake.
mcp = ["mcp>=1.28,<3"]
# Claude Agent SDK. The interceptor wraps ``claude_agent_sdk.query`` and
# ``ClaudeSDKClient`` and reads the SDK's message types; 0.2.168 is the
# release it was built and tested against, and 0.3 may change them.
claude-agent-sdk = ["claude-agent-sdk>=0.2.168,<0.3"]
# Test tooling without the frameworks. The CI lane that runs the unit
# suite against the newest SDK majors installs this, because the
# framework packages in ``dev`` pin the SDKs below their current majors.
test = [
    "pytest>=9",
    # 1.x is the line that supports pytest 9.
    "pytest-asyncio>=1.0",
    "pytest-xdist>=3.5,<4",
    "mypy>=2.4",
    "ruff>=0.3",
    "respx>=0.20",
    "tiktoken>=0.5",
]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "pytest-cov>=7.0",
    # Runs the parallel phase of the integration suite: `make
    # test-integration` splits it into an xdist phase and a serial
    # phase of the tests marked `exclusive`.
    "pytest-xdist>=3.5,<4",
    "mypy>=2.4",
    "ruff>=0.3",
    "httpx>=0.25",
    # Used by tests/integration/test_sensor_e2e.py to mock provider HTTP
    # so the sensor can be exercised end-to-end against a live stack
    # without real Anthropic / OpenAI tokens.
    "respx>=0.20",
    # Same floor as the [project.optional-dependencies] anthropic extra.
    "anthropic>=0.86",
    "openai>=1.0",
    # Unit-test-time litellm so tests/unit/test_patch.py and
    # tests/unit/test_providers.py can import litellm and exercise the
    # SensorLitellm interceptor + LitellmProvider extractor. Unit tests
    # do not make real API calls -- they mock ``litellm.completion``'s
    # return value and assert the sensor emits the right pre/post-call
    # events around it. The floor sits on the litellm line that is
    # current with openai 2.x: uv.lock resolves this lane together with
    # the SDK-majors lane, where only litellm 1.83.0 still accepts
    # openai 3, and without a higher floor here the lock would hold this
    # lane on that old release too. The published litellm extra keeps
    # the 1.83.0 floor (compromised 1.82.7 / 1.82.8 builds).
    "litellm>=1.100",
    # Used by tests/integration/test_framework_patching.py to verify
    # that flightdeck_sensor.patch() transparently intercepts LLM calls
    # made through agent frameworks without any explicit wrap() call.
    # The framework instantiates its own internal Anthropic / OpenAI
    # client; the sensor's patch reaches it (the Anthropic Messages
    # resource methods; the OpenAI client descriptor on first .chat
    # access).
    "langchain-anthropic>=1,<2",
    "langchain-openai>=1,<2",
    # langchain umbrella package — provides ``langchain.agents.
    # create_agent`` used by the LangChain MCP-policy playground (24).
    "langchain>=1,<2",
    "llama-index-llms-anthropic>=0.1",
    "llama-index-llms-openai>=0.1",
    # MCP adapters per framework. langgraph's ToolNode + langchain
    # MCP adapter and llama-index-tools-mcp BasicMCPClient drive
    # the MCP smoke tests; mcpadapt (via crewai-tools[mcp]) drives
    # the CrewAI MCP path. Without these, smoke / playground MCP
    # sections skip and the wire-level event emission isn't
    # exercised.
    # langchain-mcp-adapters stays on the mcp 1.x line the sensor
    # supports; ``langchain[mcp]`` (fastmcp 4) needs mcp 2.x.
    "langchain-mcp-adapters>=0.3,<0.4",
    # Drives the Claude Agent SDK interceptor tests.
    "claude-agent-sdk>=0.2.168,<0.3",
    "langgraph>=1,<2",
    "llama-index-tools-mcp>=0.1",
    "mcpadapt>=0.0.6",
    # CrewAI 1.14+ ships native provider classes that use the official
    # openai/anthropic SDKs directly (NOT litellm). The default
    # LLM(model=...).call(...) flow is intercepted via the sensor's
    # OpenAI.chat / Anthropic.messages descriptors. Beta paths
    # (responses API, beta.messages, beta.chat.completions.parse) are
    # NOT intercepted -- documented as a known constraint in
    # ARCHITECTURE.md "Framework limitations". See
    # test_crewai_native_openai_patched_intercepts_call. crewai declares
    # requires-python <3.14, so it is installed only below 3.14; on 3.14
    # the crewai tests skip (pytest.importorskip) and the rest of the
    # framework lane still runs.
    "crewai>=1.14; python_version < '3.14'",
    # MCP unit tests construct a ClientSession against in-memory
    # anyio streams, apply the patch, and assert event-emission shape.
    # The smoke matrix uses the same package against a real reference
    # MCP server subprocess. Both share this dev install. The framework
    # lane stays on mcp 1.x because CrewAI and langchain-mcp-adapters pin
    # it; the SDK-majors CI lane tests mcp 2.x.
    "mcp>=1.28,<2",
]

[dependency-groups]
# The newest SDK majors, which the framework packages in the dev extra
# hold back. CI's SDK-majors lane installs this group with the test
# extra, so a fresh `pip install flightdeck-sensor[anthropic,openai]` is
# tested too. A dependency group is not part of the published package.
sdk-majors = [
    "anthropic>=2",
    "openai>=3",
    "litellm>=1.83.0",
    "mcp>=2,<3",
]

[tool.uv]
# uv.lock resolves both CI lanes in one file; the framework lane (dev
# extra) and the SDK-majors lane need different majors of the same
# packages, so they are declared as alternatives.
conflicts = [
    [{ extra = "dev" }, { group = "sdk-majors" }],
]
# Every `uv lock` resolves to releases at least 14 days old: brand-new
# releases are where hijacked or broken versions are caught and yanked
# (Dependabot applies the same cooldown). anthropic only has to be a day
# old, in both lanes, because the SDK-majors lane exists to test its
# newest major, which can be days old (2.0.0 shipped 2026-10-21). Both
# are rolling spans, so they never go stale.
exclude-newer = "14 days"
exclude-newer-package = { anthropic = "1 day" }

[tool.hatch.build.targets.wheel]
packages = ["flightdeck_sensor"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# crewai is not installed on Python 3.14 (it declares <3.14), so the
# 3.14 CI job type-checks without it. Where it is installed, it is
# checked as usual; this only tolerates its absence.
[[tool.mypy.overrides]]
module = ["crewai", "crewai.*"]
ignore_missing_imports = true

[tool.ruff]
# No target-version: ruff reads the minimum Python from requires-python.
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.per-file-ignores]
# Test doubles mirror real framework class/function names (StateGraph,
# CrewAIAgent, _Timeout, etc.) verbatim so the tests read like the code
# they stand in for; relax pep8-naming for locals/args/functions/excepts
# inside tests where lowercasing would obscure the mimicry.
"tests/**" = ["N802", "N803", "N806", "N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# respx's pytest plugin imports httpx as pytest starts, before
# tests/conftest.py can alias httpx to httpx2 for SDKs built on httpx2;
# the tests use respx through its decorator, which needs no plugin.
addopts = "-p no:respx"
