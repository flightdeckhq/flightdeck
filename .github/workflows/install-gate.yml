name: Install gate

# The from-scratch install gate: on fresh runners of every supported
# platform, install flightdeck through the channel under test and start
# it with no database and nothing else configured, as a new user does.
# It must serve health, print its token, name a SQLite database in its
# data dir, accept one sensor-shaped event, list the session, serve the
# dashboard, stop, and serve that session again after a restart on the
# same data dir (scripts/install-gate.sh). Every step fails the leg.
#
# Runs when the Release workflow finishes on a tag (the artifacts it
# published are what is installed) and by hand with a tag, including a
# pre-release tag from a dry run (RELEASING.md). On a pre-release the
# Homebrew leg installs through install.sh instead, since the formula is
# published for stable tags only.
#
# Legs (RELEASING.md lists what each proves):
#   ubuntu-24.04      amd64  install.sh (the curl | sh path), pip + uvx, docker run,
#                            and the binary once more on a Postgres
#   ubuntu-24.04-arm  arm64  install.sh
#   macos-14          arm64  brew install flightdeckhq/tap/flightdeck, brew services
#   macos-15-intel    amd64  install.sh
#   windows-2022      amd64  install.ps1 (the irm | iex path, the .zip)
#
# No leg gives the binary a database. Postgres stays a supported one
# (`--database-url postgres://…`), so the linux-amd64 leg alone runs the
# checks a second time against a Postgres service container; nothing
# else in this workflow starts or names a database.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to test (vX.Y.Z or vX.Y.Z-rc.N), already published"
        required: true
        type: string

permissions:
  contents: read

env:
  # The binary's own default; each leg's first run of the checks uses it.
  GATE_LISTEN: 127.0.0.1:4000

jobs:
  resolve:
    name: Resolve the tag
    runs-on: ubuntu-24.04
    # A failed release publishes nothing to install.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
      pep440: ${{ steps.tag.outputs.pep440 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Tag, pre-release flag and PEP 440 version
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          # For a tag push, workflow_run's head_branch is the tag name.
          RUN_TAG: ${{ github.event.workflow_run.head_branch }}
        run: |
          tag="${INPUT_TAG:-$RUN_TAG}"
          # The release tag grammar (scripts/version.py, build_wheels.py).
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::'$tag' is not a release tag (vX.Y.Z or vX.Y.Z-(alpha|beta|rc).N)"
            exit 1
          fi
          case "$tag" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          pep440="$(python3 -c 'import sys; sys.path.insert(0, "packaging/pypi"); import build_wheels; print(build_wheels.pep440_version(sys.argv[1]))' "$tag")"
          {
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "pep440=$pep440"
          } >> "$GITHUB_OUTPUT"
          echo "::notice::Gate on $tag (pre-release: $prerelease, PyPI version $pep440)"

  linux:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    # The amd64 leg takes a few minutes: four runs of the checks, each a
    # few seconds, the image pull, and at worst the ten minutes the pip
    # step waits for PyPI's index. Thirty turns a step that wedges into
    # a failed leg with its log, not a run that sits until GitHub's
    # six-hour default.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64 (install.sh, pip, uvx, docker, Postgres)
            runner: ubuntu-24.04
            extras: true
            # Pinned by digest, as the dev stack's and CI's are not: the
            # gate must fail on the binary, never on a base-image change.
            postgres: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
          - name: linux-arm64 (install.sh)
            runner: ubuntu-24.04-arm
            extras: false
            postgres: ""
    services:
      # For the one Postgres run of the checks, on linux-amd64 ("Gate
      # (install.sh binary on Postgres)" below). The arm64 leg's image
      # is the empty string, and a service whose image is an empty
      # string is not started; GitHub documents that as the way to make
      # a service conditional:
      # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#jobsjob_idservicesservice_idimage
      # Every other run in this workflow, on every leg, has no database
      # to reach.
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: flightdeck
          POSTGRES_PASSWORD: flightdeck_gate
          POSTGRES_DB: flightdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightdeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag under test: its install scripts and gate checks, not
          # the default branch's.
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      # cosign on the runner, so install.sh verifies the signature of
      # checksums.txt as a user with cosign would; the step fails when
      # the installer reports the check was skipped.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # The installer as users run it, piped from the raw URL of the tag
      # (what main serves once the tag's commit is on main).
      - name: install.sh (curl | sh)
        run: |
          # A failed download or installer fails here, not at the grep.
          set -o pipefail
          test ! -e /usr/local/bin/flightdeck
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" | VERSION="$TAG" sh | tee "$RUNNER_TEMP/install.log"
          grep -q 'Signature of checksums.txt verified' "$RUNNER_TEMP/install.log"
          command -v flightdeck
          flightdeck --version

      # The primary path: nothing configured, the database is the SQLite
      # file the binary creates in its data dir.
      - name: Gate (install.sh binary)
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run "$GATE_LISTEN" "$(command -v flightdeck)"

      # The supported alternative, on this leg only: the same binary and
      # the same checks with the database named by --database-url, on an
      # empty Postgres (the binary creates the schema).
      - name: Gate (install.sh binary on Postgres)
        if: matrix.extras
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
          GATE_EXPECT_DATABASE: Postgres
        run: |
          scripts/install-gate.sh run 127.0.0.1:4003 "$(command -v flightdeck)" \
            --database-url 'postgres://flightdeck:flightdeck_gate@127.0.0.1:5432/flightdeck?sslmode=disable'

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        if: matrix.extras
        with:
          python-version: "3.12"

      # PyPI's index can lag the upload by a minute or two.
      - name: pip install flightdeck-cli
        if: matrix.extras
        env:
          PEP440: ${{ needs.resolve.outputs.pep440 }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          for i in $(seq 1 20); do
            if "$RUNNER_TEMP/venv/bin/pip" install --no-cache-dir "flightdeck-cli==$PEP440"; then break; fi
            [ "$i" -lt 20 ] || { echo "::error::flightdeck-cli==$PEP440 not installable from PyPI after 10 minutes"; exit 1; }
            sleep 30
          done
          "$RUNNER_TEMP/venv/bin/flightdeck" --version | grep -qx "flightdeck $TAG"
          "$RUNNER_TEMP/venv/bin/flightdeck-cli" --version | grep -qx "flightdeck $TAG"

      - name: Gate (pip binary)
        if: matrix.extras
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run 127.0.0.1:4001 "$RUNNER_TEMP/venv/bin/flightdeck"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        if: matrix.extras

      - name: uvx flightdeck-cli
        if: matrix.extras
        env:
          PEP440: ${{ needs.resolve.outputs.pep440 }}
        run: |
          uvx --from "flightdeck-cli==$PEP440" flightdeck-cli --version | grep -qx "flightdeck $TAG"
          uvx --from "flightdeck-cli==$PEP440" flightdeck --version | grep -qx "flightdeck $TAG"

      - name: docker run flightdeckhq/flightdeck
        if: matrix.extras
        run: |
          docker pull "flightdeckhq/flightdeck:$TAG"
          docker run --rm "flightdeckhq/flightdeck:$TAG" --version | grep -qx "flightdeck $TAG"
          # The documented command, detached: a port and a new named
          # volume for /data, no database, no environment.
          docker run -d --name flightdeck -p 127.0.0.1:4002:4000 -v flightdeck-gate:/data \
            "flightdeckhq/flightdeck:$TAG"

      # check also fails on the binary's data-dir warning: the image's
      # /data, and so the new volume, must be 0700.
      - name: Gate (container)
        if: matrix.extras
        env:
          GATE_STATE_FILE: ${{ runner.temp }}/container-gate.state
        run: scripts/install-gate.sh check http://127.0.0.1:4002 docker logs flightdeck

      # The volume is what holds the data: the container is removed, and
      # a new one on the same volume serves the session to the same token.
      - name: Container stops cleanly, a new one on the volume keeps the session
        if: matrix.extras
        env:
          GATE_STATE_FILE: ${{ runner.temp }}/container-gate.state
        run: |
          docker stop -t 30 flightdeck
          test "$(docker inspect flightdeck --format '{{.State.ExitCode}}')" = "0"
          docker rm flightdeck
          docker run -d --name flightdeck -p 127.0.0.1:4002:4000 -v flightdeck-gate:/data \
            "flightdeckhq/flightdeck:$TAG"
          scripts/install-gate.sh kept http://127.0.0.1:4002 docker logs flightdeck
          docker stop -t 30 flightdeck
          test "$(docker inspect flightdeck --format '{{.State.ExitCode}}')" = "0"
          docker rm flightdeck
          rm -f "$GATE_STATE_FILE"

  macos:
    name: ${{ matrix.name }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    # An install and two runs of the checks, a few minutes in all;
    # twenty fails a leg that wedges (a service that never stops, a
    # download that stalls) long before the six-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64 (brew)
            runner: macos-14
            channel: brew
          - name: macos-amd64 (install.sh)
            runner: macos-15-intel
            channel: install.sh
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag under test: its install scripts and gate checks, not
          # the default branch's.
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      - name: brew install flightdeckhq/tap/flightdeck
        if: matrix.channel == 'brew' && env.PRERELEASE == 'false'
        run: |
          brew install flightdeckhq/tap/flightdeck
          brew test flightdeck
          echo "FLIGHTDECK_BIN=$(brew --prefix)/bin/flightdeck" >> "$GITHUB_ENV"

      - name: install.sh (curl | sh)
        if: matrix.channel == 'install.sh' || env.PRERELEASE == 'true'
        run: |
          # A failed download fails the step: sh exits 0 on empty input.
          set -o pipefail
          if [ "${{ matrix.channel }}" = brew ]; then
            echo "::warning::$TAG is a pre-release, which the tap does not carry; this leg installs with install.sh"
          fi
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${TAG}/install.sh" | VERSION="$TAG" sh
          echo "FLIGHTDECK_BIN=$(command -v flightdeck)" >> "$GITHUB_ENV"

      - name: Gate
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run "$GATE_LISTEN" "$FLIGHTDECK_BIN"

      # brew services runs the binary with its defaults and no
      # environment: loopback :4000 (free again, the step above stopped
      # its server) and ~/.flightdeck, the data dir a `flightdeck` typed
      # in a terminal uses, so the service and the command share one
      # database. The same checks as everywhere, read from the service's
      # log, then a stop and a start of the service: the session is
      # still served.
      - name: brew services start flightdeck
        if: matrix.channel == 'brew' && env.PRERELEASE == 'false'
        env:
          GATE_STATE_FILE: ${{ runner.temp }}/brew-gate.state
        run: |
          test ! -e "$HOME/.flightdeck"
          log="$(brew --prefix)/var/log/flightdeck.log"
          brew services start flightdeck
          scripts/install-gate.sh check "http://$GATE_LISTEN" cat "$log"
          test -f "$HOME/.flightdeck/flightdeck.db"
          brew services stop flightdeck
          scripts/install-gate.sh down "http://$GATE_LISTEN"
          brew services start flightdeck
          scripts/install-gate.sh kept "http://$GATE_LISTEN" cat "$log"
          brew services stop flightdeck
          rm -f "$GATE_STATE_FILE"

      # However the step above ended, the service is not left running
      # (keep_alive restarts it for as long as it is loaded).
      - name: Stop the Homebrew service
        if: always() && matrix.channel == 'brew' && env.PRERELEASE == 'false'
        run: brew services stop flightdeck || true

  windows:
    name: windows-amd64 (install.ps1)
    needs: resolve
    runs-on: windows-2022
    # An install and one run of the checks, a few minutes on a cold
    # disk; twenty fails a leg that wedges long before the six-hour
    # default.
    timeout-minutes: 20
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The tag under test: its install scripts and gate checks, not
          # the default branch's.
          ref: ${{ needs.resolve.outputs.tag }}
          persist-credentials: false

      # cosign on the runner, so install.ps1 takes its signature-check
      # path (the one that reads cosign's stderr) on every gate run.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532  # v4.1.3

      # PSScriptAnalyzer ships on the Windows runner image; the installer
      # is linted on the platform that runs it.
      - name: PSScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings) { throw "PSScriptAnalyzer: $($findings.Count) finding(s) in install.ps1" }

      # The installer as users run it, piped from the raw URL of the tag.
      # It appends its directory to GITHUB_PATH.
      - name: install.ps1 (irm | iex)
        shell: pwsh
        env:
          VERSION: ${{ env.TAG }}
        run: |
          $out = irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:TAG/install.ps1" | iex *>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'Signature of checksums.txt verified') { throw 'install.ps1 did not verify the signature of checksums.txt' }

      - name: flightdeck --version
        shell: pwsh
        run: |
          $printed = flightdeck --version
          if ($printed -ne "flightdeck $env:TAG") { throw "printed '$printed', want 'flightdeck $env:TAG'" }

      - name: Gate
        shell: bash
        env:
          GATE_EXPECT_VERSION: ${{ env.TAG }}
        run: scripts/install-gate.sh run "$GATE_LISTEN" "$(command -v flightdeck)"
