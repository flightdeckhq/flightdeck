# E2E override, layered on docker-compose.yml + docker-compose.dev.yml:
# the dashboard container builds the app and serves the production
# bundle (vite preview, on the port the dev nginx proxies to) instead of
# running the Vite dev server, which compiles modules on demand for every
# page load. The browser suite then tests the bundle users get and
# spends its time in the app, not in the compiler.
services:
  dashboard:
    command: ["sh", "-c", "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 3000 --strictPort"]
