# The split test stack: the three services as separate containers, run
# from source, with a NATS server between them, a Postgres of their own
# and a small nginx in front. `make dev-split` starts it, `make
# test-split` runs the tests that need it, `make down-split` removes it:
#
#   docker compose -p flightdeck-split -f docker/docker-compose.split.yml up -d --wait
#
# It exists for the integration tests that pause the worker container
# (tests/shared/fixtures.py, worker_paused): the `flightdeck` binary
# runs the workers as goroutines of the one process, where nothing can
# be paused alone. Nothing ships this topology.
#
# It is a compose project of its own, on its own port (4010) with its
# own database and bus, so it runs beside the dev stack and never
# touches the dev stack's database. Only the front door is published;
# the tests reach the database through `docker exec`.
#
# `go run` on a cold cache downloads every module and compiles them,
# and most of that time is one package: the pure-Go SQLite driver the
# storage module brings into every service (modernc.org/sqlite, the
# whole of SQLite as Go source). On a hosted CI runner, where the three
# services compile at once on four CPUs, ingestion began serving after
# about 155 s. The start window of the two services with a health
# check is 300 s, about twice that; a probe that succeeds earlier ends
# the wait at once. GOFLAGS passes through from the shell, so a machine
# short of memory can hold the three compiles to two packages at a time
# each (GOFLAGS=-p=2).

# A fixed project name, as in docker-compose.yml: without it compose
# takes this directory's name, `docker`, which is the dev stack's
# project, and the two volumes below would then be the dev stack's
# `docker_postgres_data` and `docker_nats_data`: a `down -v` on this
# file would delete the dev database. `make` passes the same name with
# -p; it refuses the dev stack's and the user compose file's.
name: flightdeck-split

x-logging: &split-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    logging: *split-logging
    # The same two variables as the dev stack's Postgres: CI may run
    # the stack on another Postgres major.
    image: ${FLIGHTDECK_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: flightdeck
      POSTGRES_PASSWORD: flightdeck_dev
      POSTGRES_DB: flightdeck
    volumes:
      - postgres_data:${FLIGHTDECK_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightdeck"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Unauthenticated on purpose: reachable on the compose network only.
  nats:
    logging: *split-logging
    image: nats:2.14-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  ingestion:
    logging: *split-logging
    image: golang:1.27.4-alpine
    working_dir: /app
    command: ["go", "run", "./cmd/"]
    volumes:
      - ../ingestion:/app
      # ingestion/go.mod replaces the storage module with ../storage,
      # which from /app is /storage.
      - ../storage:/storage:ro
    environment:
      GOFLAGS: ${GOFLAGS:-}
      FLIGHTDECK_PORT: "8080"
      FLIGHTDECK_POSTGRES_URL: postgres://flightdeck:flightdeck_dev@postgres:5432/flightdeck?sslmode=disable
      FLIGHTDECK_NATS_URL: nats://nats:4222
      # tok_dev is accepted only when ENVIRONMENT=dev.
      ENVIRONMENT: dev
      SHUTDOWN_TIMEOUT_SECS: "30"
      FLIGHTDECK_NATS_STREAM_REPLICAS: "1"
      # The integration suite shares one bearer token across hundreds
      # of requests; the 1000 a minute production limit would answer
      # 429 mid-run.
      FLIGHTDECK_RATE_LIMIT_PER_MINUTE: "1000000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 300s

  workers:
    logging: *split-logging
    image: golang:1.27.4-alpine
    working_dir: /app
    command: ["go", "run", "./cmd/"]
    volumes:
      - ../workers:/app
      - ../storage:/storage:ro
    environment:
      GOFLAGS: ${GOFLAGS:-}
      FLIGHTDECK_POSTGRES_URL: postgres://flightdeck:flightdeck_dev@postgres:5432/flightdeck?sslmode=disable
      FLIGHTDECK_NATS_URL: nats://nats:4222
      FLIGHTDECK_WORKER_POOL_SIZE: "10"
      SHUTDOWN_TIMEOUT_SECS: "30"
      # The reconciler ticks every 5 s instead of 60, as in the dev
      # stack: tests/integration/test_session_states.py sizes its waits
      # from the same number.
      FLIGHTDECK_RECONCILER_INTERVAL_SECS: "5"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy

  api:
    logging: *split-logging
    image: golang:1.27.4-alpine
    working_dir: /app
    command: ["go", "run", "./cmd/"]
    volumes:
      - ../api:/app
      - ../storage:/storage:ro
      # Where the query API looks for the price overrides.
      - ../pricing.yaml:/etc/flightdeck/pricing.yaml:ro
    environment:
      GOFLAGS: ${GOFLAGS:-}
      FLIGHTDECK_PORT: "8081"
      FLIGHTDECK_POSTGRES_URL: postgres://flightdeck:flightdeck_dev@postgres:5432/flightdeck?sslmode=disable
      ENVIRONMENT: dev
      SHUTDOWN_TIMEOUT_SECS: "30"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 300s

  # One origin for the suite, as the binary gives it: /api and /ingest,
  # each path forwarded as sent (the services strip their own prefix).
  # There is no dashboard here.
  frontdoor:
    logging: *split-logging
    image: nginx:1.30-alpine
    configs:
      - source: frontdoor
        target: /etc/nginx/conf.d/default.conf
    ports:
      - "127.0.0.1:${FLIGHTDECK_SPLIT_PORT:-4010}:4000"
    depends_on:
      api:
        condition: service_healthy
      ingestion:
        condition: service_healthy

configs:
  frontdoor:
    content: |
      # Idle upstream connections close before the services' own idle
      # timeouts (ingestion 60 s, the query API 120 s), so nginx never
      # writes a request onto a connection the backend already closed.
      upstream api {
          server api:8081;
          keepalive_timeout 50s;
      }
      upstream ingestion {
          server ingestion:8080;
          keepalive_timeout 50s;
      }
      server {
          listen 4000;
          server_name _;
          location /api/ {
              proxy_pass http://api;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
              # The WebSocket at /api/v1/stream.
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_read_timeout 86400s;
          }
          # The OTLP receiver accepts request bodies up to 4 MiB;
          # nginx's 1m default would answer 413 before ingestion saw
          # them.
          location /ingest/ {
              client_max_body_size 4m;
              proxy_pass http://ingestion;
              proxy_http_version 1.1;
              proxy_set_header Host $$host;
          }
      }

volumes:
  postgres_data:
  nats_data:
