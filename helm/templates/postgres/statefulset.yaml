{{- /*
Bundled Postgres StatefulSet, rendered with postgres.enabled and
suppressed when postgres.externalUrl is set: operators are expected to
point at a managed database in that case. See values.yaml for the
rationale: the chart does not ship HA or backups.
*/ -}}
{{- if include "flightdeck.postgresBundled" . -}}
{{- $component := "postgres" -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  serviceName: {{ include "flightdeck.postgresServiceName" . }}
  replicas: 1
  {{- include "flightdeck.pvcRetention" . | nindent 2 }}
  selector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 8 }}
      {{- with .Values.postgres.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "flightdeck.serviceAccountName" (dict "root" . "component" $component) }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        # postgres image runs as UID 70 (postgres user) on alpine.
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        # The kubelet gives the volume to the group once, when its root
        # does not match, instead of walking every file of the database
        # at each mount.
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ include "flightdeck.imageRef" (dict "root" . "image" .Values.postgres.image "key" "postgres.image") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The root filesystem is read-only: the server writes its data
          # under the volume, its socket and lock under
          # /var/run/postgresql and temporary files under /tmp, the two
          # emptyDirs below.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # The official image passes arguments that start with "-" to
          # the server. The value is 80 connections for every flightdeck
          # pod the chart may run, plus 20 (see the helper).
          args:
            - "-c"
            - "max_connections={{ include "flightdeck.postgresMaxConnections" . }}"
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
              protocol: TCP
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightdeck.secretName" . }}
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  {{- if .Values.postgres.passwordSecret.name }}
                  name: {{ .Values.postgres.passwordSecret.name }}
                  key: {{ .Values.postgres.passwordSecret.key }}
                  {{- else }}
                  name: {{ include "flightdeck.secretName" . }}
                  key: POSTGRES_PASSWORD
                  {{- end }}
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: {{ include "flightdeck.secretName" . }}
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgres.user }}", "-d", "{{ .Values.postgres.database }}"]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
      {{- with .Values.postgres.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgres.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.storage.storageClassName }}
        storageClassName: {{ .Values.postgres.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage.size }}
{{- end }}
