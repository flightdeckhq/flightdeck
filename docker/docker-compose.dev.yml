# The contributors' dev stack: Postgres and NATS in containers, the
# `flightdeck` binary from source on the host (scripts/dev-stack.sh,
# `make dev`). Users do not run this file; they run docker-compose.yml.
#
# The binary listens on 127.0.0.1:4000, so the development token
# `tok_dev` works, as the test suites and the plugin expect; it uses
# this Postgres through --database-url and its own embedded NATS. The
# NATS here serves the Go tests gated on TEST_NATS_URL
# (scripts/go-db-tests.sh); nothing else connects to it.
#
# The project name is fixed so the container names stay
# `docker-postgres-1` and `docker-nats-1` whatever directory the command
# runs from: the test harness (tests/shared/fixtures.py,
# scripts/go-db-tests.sh, the E2E seeder) shells into them by name. The
# FLIGHTDECK_DEV_*_PORT variables (set by scripts/dev-stack.sh from
# DEV_PG_PORT and friends) move the loopback ports for a second stack
# beside a running one.
name: docker

services:
  postgres:
    # FLIGHTDECK_POSTGRES_IMAGE / FLIGHTDECK_POSTGRES_DATA_DIR let CI run
    # the stack on another Postgres major; Postgres 18 images keep their
    # data under /var/lib/postgresql (the volume mounts there) instead of
    # /var/lib/postgresql/data.
    image: ${FLIGHTDECK_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: flightdeck
      POSTGRES_PASSWORD: flightdeck_dev
      POSTGRES_DB: flightdeck
    volumes:
      - postgres_data:${FLIGHTDECK_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Loopback only: the database must never be reachable from the
      # LAN in a dev loop. 127.0.0.1 so `docker compose` does not
      # default-publish on 0.0.0.0.
      - "127.0.0.1:${FLIGHTDECK_DEV_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightdeck"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: &dev-logging
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Unauthenticated on purpose: a single-host developer loop on
  # loopback, where a token round-trip only slows the feedback cycle.
  # The Helm chart's NATS takes nats.auth.token.
  nats:
    image: nats:2.14-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    volumes:
      - nats_data:/data
    ports:
      - "127.0.0.1:${FLIGHTDECK_DEV_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${FLIGHTDECK_DEV_NATS_MONITOR_PORT:-8222}:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *dev-logging

volumes:
  postgres_data:
  nats_data:
