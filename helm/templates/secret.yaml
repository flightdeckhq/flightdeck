{{- /*
Shared Secret: the database URL the pods read when the database is
Postgres (external or bundled), the bundled Postgres's own credentials,
and the NATS URL, with the token of the chart's cluster, when the pods
share a bus. Only what comes from values: a secret given as one of the
*Secret values (the operator's own Secret) is not copied here, and the
URL built from it is set in the pod spec (flightdeck.secretEnv). On
SQLite with the embedded bus it is empty. The pods' other secrets, the
dashboard token and the JWT secret, are generated by the binary into
each pod's data dir (secrets.json).
*/ -}}
{{- $bundled := include "flightdeck.postgresBundled" . -}}
{{- $databaseURL := or .Values.postgres.externalUrl (and $bundled (not .Values.postgres.passwordSecret.name)) -}}
{{- $natsToken := and (include "flightdeck.natsEnabled" .) (not .Values.nats.auth.tokenSecret.name) -}}
{{- $natsURL := or .Values.nats.externalUrl $natsToken -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flightdeck.secretName" . }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "shared") | nindent 4 }}
type: Opaque
{{- if or $databaseURL $bundled $natsURL }}
stringData:
  {{- if $databaseURL }}
  FLIGHTDECK_DATABASE_URL: {{ include "flightdeck.postgresURL" . | quote }}
  {{- end }}
  {{- if $bundled }}
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  {{- if not .Values.postgres.passwordSecret.name }}
  POSTGRES_PASSWORD: {{ include "flightdeck.postgresPassword" . | quote }}
  {{- end }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  {{- end }}
  {{- if $natsToken }}
  FLIGHTDECK_NATS_TOKEN: {{ include "flightdeck.natsToken" . | quote }}
  {{- end }}
  {{- if $natsURL }}
  FLIGHTDECK_NATS_URL: {{ include "flightdeck.natsURL" . | quote }}
  {{- end }}
{{- else }}
stringData: {}
{{- end }}
