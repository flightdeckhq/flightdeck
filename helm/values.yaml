# Default values for the flightdeck chart.
#
# The chart runs the one `flightdeck` binary (ingestion API, workers,
# query API and the dashboard in one process) as a StatefulSet on
# Postgres: the chart's own single-instance Postgres, or a managed one
# through postgres.externalUrl. One replica runs with the binary's
# embedded NATS; more than one replica needs one bus they all share, so
# the chart then runs a NATS cluster and points every pod at it with
# --nats-url.
#
# image.tag is pinned to the release this chart ships with
# (scripts/version.py keeps it in step with the VERSION file).

nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io
  repository: flightdeckhq/flightdeck
  tag: "v0.8.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

flightdeck:
  # Pods. Each pod is a whole control plane behind the one Service;
  # the Ingress and the Service spread requests over them. With more
  # than one replica (or the HPA on), nats.enabled must not be false:
  # the pods need one shared bus, and the render fails otherwise.
  replicas: 1
  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  # The one port: the dashboard at /, the query API under /api and the
  # ingestion API under /ingest.
  port: 4000
  service:
    type: ClusterIP
    port: 4000
  # --metrics: the three services' metrics listeners on their default
  # ports (workers 9102, ingestion 9103, query API 9104), declared on the
  # pod and listed on the headless <release>-flightdeck-metrics Service
  # for a scraper or a ServiceMonitor. They carry no auth, so they are
  # never on the Service the Ingress routes to.
  metrics:
    enabled: true
  # Access-Control-Allow-Origin of the query API. Empty keeps the
  # binary's default ("*"); the dashboard is served from the same
  # origin, so the API needs no cross-origin caller. Set it to the
  # dashboard's origin (https://flightdeck.example.com) to refuse
  # browser calls from anywhere else.
  corsOrigin: ""
  # Events per minute each access token may send to one pod; the
  # sensor, the plugin and the OpenTelemetry exporters share a token's
  # budget.
  rateLimitPerMinute: 1000
  # Worker goroutines consuming the bus in each pod.
  workerPoolSize: 10
  shutdownTimeoutSecs: 30
  # Further FLIGHTDECK_* tunables (ARCHITECTURE.md, Deployment), as
  # name: value.
  extraEnv: {}
  # The data dir (/data) of each pod, a PersistentVolumeClaim of its
  # own: secrets.json (the dashboard token the pod minted), the TLS
  # cache, and the embedded NATS JetStream store when the chart runs no
  # NATS cluster. Sized for the embedded bus's default 5 GiB stream
  # limit with room for the store's overhead.
  data:
    size: "10Gi"
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Agent-side defaults, surfaced in the <release>-config ConfigMap for
  # operators who wire them into their agent deployments with envFrom.
  # The binary ignores them.
  agents:
    flavor: ""
    # ``coding`` or ``production``; another value makes
    # flightdeck_sensor.init() raise ConfigurationError.
    type: "production"
    unavailablePolicy: "continue"
    capturePrompts: false

# NetworkPolicy hardening: only the flightdeck pods may reach Postgres
# and the NATS cluster (see templates/networkpolicy.yaml). Requires a
# CNI that enforces NetworkPolicy; set false to disable.
networkPolicy:
  enabled: true

nats:
  # The NATS cluster the pods share through --nats-url. null (the
  # default) runs it exactly when the chart runs more than one flightdeck
  # replica or the HPA is on; true runs it for one replica too; false
  # never, and the render then refuses more than one replica.
  enabled: null
  image:
    repository: nats
    tag: "2.14.3-alpine"
  # With more than one replica the servers form a NATS cluster over
  # clusterPort (routes between the StatefulSet pods), so a message
  # published on any server reaches a consumer on any other and
  # JetStream runs clustered.
  replicas: 3
  clientPort: 4222
  monitorPort: 8222
  clusterPort: 6222
  auth:
    # Client token for the event bus. Required whenever the cluster is
    # rendered: an unauthenticated bus lets any pod that can reach it
    # forge events or drain the queue. Set via
    # --set nats.auth.token=<strong-random-token>; letters, digits and
    # . _ ~ - only, since it is placed in NATS URLs (openssl rand -hex 32).
    # With replicas > 1 the cluster routes authenticate with it as well.
    token: ""
  jetstream:
    fileStore:
      size: "10Gi"
      storageClassName: ""
    # The FLIGHTDECK stream that carries every event from ingestion to
    # the workers. The binary creates it with these settings, or updates
    # an existing stream to them in place, at startup. The stream keeps
    # a message until a limit removes it, processed or not, and at the
    # size limit removes the oldest: events the workers have not
    # processed are lost when the workers are down for longer than
    # maxAgeHours, or fall further behind than maxSizeMiB. The same two
    # limits apply to the embedded bus of a one-replica install.
    stream:
      # How long a message is kept. 72 hours lets the workers be down
      # from a Friday evening to a Monday morning without losing events.
      maxAgeHours: 72
      # The most the stream stores on each NATS server, in MiB. Every
      # server holds a full replica on its own fileStore volume, and a
      # NATS server without a configured store limit reserves at most
      # 75% of the volume's free space when it starts, so keep this
      # well under that: 5120 MiB (5 GiB) on the 10Gi default volume.
      # The render fails above 75% of fileStore.size.
      maxSizeMiB: 5120
      # Servers holding a copy of the stream. Empty: 3 when
      # nats.replicas is at least 3, otherwise 1. Set: 1 to 5 but not 2
      # (two copies stop the stream when either server is lost), at
      # most nats.replicas. Raising it on an existing install copies the
      # stream to the new servers in place. Without the cluster (the
      # embedded bus) the stream has one copy.
      replicas: null
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  # externalUrl is the single escape hatch for Postgres: when set to a full
  # DSN (e.g. postgres://user:pass@host:5432/flightdeck?sslmode=require) the
  # bundled StatefulSet and Service are not rendered and the pods read
  # this DSN from the generated Secret. Percent-encode reserved
  # characters in the password (`@` as %40): the URL's user:password
  # part ends at the first `@`. When empty the chart ships its own
  # single-instance StatefulSet, with no HA and no backups; use
  # externalUrl for either.
  externalUrl: ""
  image:
    repository: postgres
    tag: "16.15-alpine"
  user: flightdeck
  # Required when postgres.externalUrl is empty (the bundled StatefulSet
  # path): --set postgres.password=<strong-password>, or a values file
  # scoped to the install. The render fails without it rather than
  # defaulting to a well-known password every install would share.
  password: ""
  database: flightdeck
  port: 5432
  sslmode: disable
  storage:
    size: "20Gi"
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  # The OpenTelemetry receiver under /ingest accepts request bodies up
  # to 4 MiB; an ingress controller with a smaller default (ingress-nginx:
  # 1m) needs its body-size annotation raised, as values.prod.yaml does.
  annotations: {}
  host: flightdeck.local
  tls: []
  # Everything on one path: the binary routes /, /api and /ingest itself.
  pathType: Prefix

serviceAccount:
  # Per-component ServiceAccounts are always rendered. Roles/RoleBindings
  # are empty by default (no permissions granted) -- they exist as a
  # placeholder for operators who want to scope future permissions.
  create: true

# The image runs as distroless's nonroot user (uid 65532), which owns
# /data; the bundled NATS and Postgres pods set their own images' users.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532

# The binary writes only under /data, so the root filesystem is read-only.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
