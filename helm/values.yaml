# Default values for the flightdeck chart.
# All values are documented with their production implications.
#
# Image tags are pinned to the release this chart ships with (image.tag;
# scripts/version.py keeps it in step with the VERSION file).
# Override image.tag (or a per-component tag) to deploy a different release.

nameOverride: ""
fullnameOverride: ""

image:
  registry: docker.io
  repository: flightdeckhq
  tag: "v0.8.0"
  pullPolicy: IfNotPresent
  pullSecrets: []

# Agent-side defaults documented for operators who want to consume them in
# their agent deployments via envFrom on the flightdeck-config ConfigMap.
# These keys do not affect server-component behaviour; they are surfaced in
# the ConfigMap for convenience only. Reference: ARCHITECTURE.md lines 2754-2759.
flightdeck:
  agents:
    flavor: ""
    # Accepted vocabulary: ``coding`` (developer-driven sessions)
    # or ``production`` (long-running autonomous agents). Invalid
    # values cause flightdeck_sensor.init() to raise
    # ConfigurationError. Previous values ("autonomous",
    # "supervised", "batch") no longer accepted.
    type: "production"
  unavailablePolicy: "continue"
  capturePrompts: false

ingestion:
  replicas: 2
  port: 8080
  image:
    repository: flightdeck-ingestion
    tag: ""  # inherits image.tag when empty
  env: "production"
  shutdownTimeoutSecs: 30
  rateLimitPerMinute: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8080
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

workers:
  replicas: 2
  image:
    repository: flightdeck-workers
    tag: ""
  poolSize: 10
  shutdownTimeoutSecs: 30
  migrationsDir: /migrations
  # Port of the metrics listener (the counter registry at /metrics, in
  # the Prometheus text format). The readiness probe uses it too. 0
  # turns the listener off and readiness falls back to process-alive.
  metricsPort: 9102
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

api:
  replicas: 2
  port: 8081
  image:
    repository: flightdeck-api
    tag: ""
  env: "production"
  shutdownTimeoutSecs: 30
  corsOrigin: "*"
  auth:
    # JWT bootstrap is evaluated at api startup when env == "production".
    # jwtSecret must be set; adminEmail + adminPassword create the initial
    # admin user on first boot.
    jwtSecret: ""
    adminEmail: ""
    adminPassword: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  service:
    type: ClusterIP
    port: 8081
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

dashboard:
  replicas: 2
  port: 3000
  image:
    repository: flightdeck-dashboard
    tag: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  service:
    type: ClusterIP
    port: 3000
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# NetworkPolicy hardening: restrict ingress to Postgres and NATS to the
# flightdeck server pods only (see templates/networkpolicy.yaml). The
# NATS bus is unauthenticated by design, so this is the primary in-cluster
# control preventing arbitrary pods from reading/forging the event bus.
# Requires a CNI that enforces NetworkPolicy; set false to disable.
networkPolicy:
  enabled: true

nats:
  enabled: true  # The chart has no external-NATS option.
  image:
    repository: nats
    tag: "2.14.3-alpine"
  # With more than one replica the servers form a NATS cluster over
  # clusterPort (routes between the StatefulSet pods), so a message
  # published on any server reaches a consumer on any other and
  # JetStream runs clustered.
  replicas: 3
  clientPort: 4222
  monitorPort: 8222
  clusterPort: 6222
  auth:
    # Client token for the event bus. Required for a production install
    # (api.env=production): an unauthenticated bus lets any pod that can
    # reach it forge events or drain the queue. Set via
    # --set nats.auth.token=<strong-random-token>; letters, digits and
    # . _ ~ - only, since it is placed in NATS URLs (openssl rand -hex 32).
    # With replicas > 1 the cluster routes authenticate with it as well.
    token: ""
  jetstream:
    enabled: true
    fileStore:
      size: "10Gi"
      storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

postgres:
  # externalUrl is the single escape hatch for Postgres: when set to a full
  # DSN (e.g. postgres://user:pass@host:5432/flightdeck?sslmode=require) the
  # bundled StatefulSet and Service are not rendered and every dependent
  # service reads this DSN from the generated secret. Percent-encode
  # reserved characters in the password (`@` as %40): the URL's
  # user:password part ends at the first `@`. When empty the chart
  # ships its own single-instance StatefulSet. The chart does not provide HA or
  # backups for the bundled database; use externalUrl for either.
  externalUrl: ""
  image:
    repository: postgres
    tag: "16.15-alpine"
  user: flightdeck
  # Required when postgres.externalUrl is empty (the bundled StatefulSet path).
  # Set via --set postgres.password=<strong-password> or pass through a values
  # file scoped to the install. The pre-v0.5.1 behaviour silently defaulted to
  # the literal "flightdeck" if left blank, which left every bundled install
  # sharing one well-known credential — that fallback has been removed in
  # v0.5.1 and the chart now fails to render with an actionable message.
  password: ""
  database: flightdeck
  port: 5432
  sslmode: disable
  storage:
    size: "20Gi"
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: flightdeck.local
  tls: []
  # Paths are routed to the three public services. The Ingress controller
  # must support the pathType used here. Paths are forwarded unchanged and
  # need no rewrite annotation: ingestion serves its routes under /ingest
  # and the API under /api as well as bare.
  paths:
    - path: /ingest
      pathType: Prefix
      service: ingestion
    - path: /api
      pathType: Prefix
      service: api
    - path: /
      pathType: Prefix
      service: dashboard

serviceAccount:
  # Per-component ServiceAccounts are always rendered. Roles/RoleBindings
  # are empty by default (no permissions granted) -- they exist as a
  # placeholder for operators who want to scope future permissions.
  create: true

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]
