# Flightdeck as one container: the `flightdeck` binary (ingestion API,
# workers, query API, embedded NATS and the dashboard in one process)
# on SQLite, with its data under the `flightdeck_data` volume.
#
#   docker compose -f docker/docker-compose.yml up -d
#   docker compose -f docker/docker-compose.yml logs flightdeck   # the start-up block with the dashboard token
#
# :4000 inside the container is not a loopback address, so the first
# start mints an access token, prints it in the start-up block and keeps
# it in /data/secrets.json for the next starts; the dashboard reads it
# from /runtime-config.json. The development token is not accepted.
#
# Postgres instead of SQLite, for a larger fleet: add
# docker-compose.postgres.yml (a bundled Postgres and the database URL),
# or set FLIGHTDECK_DATABASE_URL to a Postgres you run.
#
# TLS: run the binary with --domain (README, Self-hosting), or set
# FLIGHTDECK_DOMAIN here and publish ports 80 and 443 in an override
# file; the binary then serves HTTPS with a Let's Encrypt certificate
# and ignores --listen.
#
# FLIGHTDECK_PUBLISH_PORT (default 4000) is the host port; the
# container always listens on 4000.

services:
  flightdeck:
    image: flightdeckhq/flightdeck:v0.8.0
    restart: unless-stopped
    ports:
      - "${FLIGHTDECK_PUBLISH_PORT:-4000}:4000"
    volumes:
      - flightdeck_data:/data
    environment:
      # Empty: SQLite at /data/flightdeck.db. A postgres:// URL switches
      # the backend (docker-compose.postgres.yml sets one).
      FLIGHTDECK_DATABASE_URL: ${FLIGHTDECK_DATABASE_URL:-}
      FLIGHTDECK_DOMAIN: ${FLIGHTDECK_DOMAIN:-}
    # Log rotation. Docker's json-file driver otherwise keeps the
    # container's whole output in one file that grows until the disk is
    # full, and the workers log a line for every event they drop, so a
    # flood of bad events would fill the host disk through the log
    # alone. 20 MiB and five files (100 MiB) are the defaults of
    # Docker's own rotating `local` driver; json-file is kept over
    # `local` because `docker logs` reads both while log shippers that
    # tail container files read only json-file. A daemon-wide log-opts
    # in /etc/docker/daemon.json does not override it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  flightdeck_data:
