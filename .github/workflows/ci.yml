name: CI

on:
  pull_request:
    branches: [main]
  # Push trigger is main-only. PR sync is itself a push event, so any
  # `feat/**` (or wildcard) addition here would fire CI twice on every
  # PR commit — once via this push trigger, once via pull_request:
  # synchronize. The pull_request trigger above already gives every
  # feature-branch PR commit pre-merge CI feedback; main-only push
  # then handles the post-merge run on the default branch.
  push:
    branches: [main]
  # Manual escape hatch: lets ``gh workflow run ci.yml --ref <branch>``
  # fire CI against any branch without depending on the pull_request
  # synchronize webhook. Useful when GitHub Actions silently fails to
  # register a check-suite for a PR sync (the May 26 2026 incident
  # surfaced this: Codecov + Claude check-suites registered for the
  # new commit but the CI workflow's suite was absent, no Actions
  # runs were queued, and close/reopen of the PR did not retrigger).
  # Pure additive — adds a "Run workflow" button on the Actions tab +
  # a CLI dispatch path; existing pull_request + push triggers are
  # untouched.
  workflow_dispatch:

# Workflow-level least privilege. Every job inherits ``contents: read``
# only — enough to clone the repo via actions/checkout, nothing more.
# No job in this workflow writes to the repo, creates issues / PRs /
# releases, pushes images, or uses OIDC, so there is no need to grant
# anything wider. A future job that needs more should override at the
# job level rather than widening the workflow default.
permissions:
  contents: read

# Cap blast radius from rapid-fire pushes on the same branch: cancel
# any in-flight run when a newer commit lands. Two pushes in quick
# succession should not boot two sets of parallel stacks (the
# integration legs and each of the four E2E shards start a dev stack).
concurrency:
  # Namespace by workflow name so a future workflow that picks the
  # same ref-keyed group doesn't accidentally cancel CI runs. Low-cost
  # future-proofing (the repo currently has just CI + release).
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sensor:
    name: Sensor (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      # Install the locked versions (sensor/uv.lock) directly into the
      # actions/setup-python interpreter -- NOT into a fresh venv. A
      # previous attempt to mirror the local-dev venv layout in CI
      # segfaulted pytest under --cov on the GHA Linux x86_64 runner
      # during collection: identical package set as the system install,
      # but the venv-installed variant crashes the coverage tracer
      # (likely a C-extension RPATH interaction in the heavy
      # onnxruntime/protobuf chain pulled in transitively via crewai).
      # UV_PROJECT_ENVIRONMENT pointed at that interpreter's prefix makes
      # uv install there; --inexact leaves the runner's own packages in
      # place. On 3.14 crewai is not installed (it does not support
      # 3.14 yet) and its tests skip.
      - name: Install dependencies
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra dev --extra anthropic --extra openai

      - name: mypy --strict
        run: mypy flightdeck_sensor/ --strict

      - name: ruff check
        run: ruff check flightdeck_sensor/

      - name: Test with coverage
        run: |
          pytest tests/ -v \
            --cov=flightdeck_sensor \
            --cov-report=term-missing \
            --cov-report=html:htmlcov \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70

      - name: Upload sensor coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-sensor-${{ matrix.python-version }}
          path: sensor/htmlcov/
          retention-days: 14

  # Branch protection requires a check named "Sensor (Python)". The
  # matrix above reports one check per Python version, so this job turns
  # them into that single required check: it passes only when every
  # version passed.
  sensor-all-versions:
    name: Sensor (Python)
    if: always()
    needs: sensor
    runs-on: ubuntu-24.04
    steps:
      - name: Every Python version passed
        run: test "${{ needs.sensor.result }}" = success

  sensor-sdk-majors:
    name: Sensor (Python ${{ matrix.python-version }}, SDK majors)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    # The job above installs the framework packages, whose pins hold the
    # provider SDKs below their current majors. This lane installs the
    # sensor with the newest anthropic and openai releases (2.x / 3.x and
    # later, built on httpx2), mcp 2.x and no frameworks (the lock's
    # sdk-majors group), so a fresh
    # `pip install flightdeck-sensor[anthropic,openai]` is tested too, on
    # the oldest and newest supported Python. Framework tests skip here;
    # tests/conftest.py aliases httpx to httpx2 so the HTTP mocks see the
    # new SDKs.
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      - name: Install the sensor with the newest SDK majors
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra test --extra anthropic --extra openai --group sdk-majors

      - name: Installed SDK versions
        run: pip list | grep -iE "^(anthropic|openai|litellm|httpx2?|mcp) "

      # The frameworks are not installed in this lane, so their optional
      # imports cannot resolve; everything else is checked strictly.
      - name: mypy --strict
        run: mypy flightdeck_sensor/ --strict --disable-error-code=import-not-found

      - name: Unit tests
        run: pytest tests/unit -q -n auto

  sensor-openai-floor:
    name: Sensor (Python ${{ matrix.python-version }}, openai floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    # The oldest openai release the sensor supports (the lock's
    # openai-floor group, the openai extra's floor), with no other SDK.
    # Before 1.78 the client builds its resources in the constructor, a
    # layout the other lanes' SDKs never show, so this lane runs the OpenAI
    # tests that drive the installed SDK; the rest of the unit suite
    # imports anthropic.
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      - name: Install the sensor with the oldest supported openai
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra test --extra openai --group openai-floor

      - name: Installed SDK versions
        run: pip list | grep -iE "^(openai|httpx) "

      - name: OpenAI tests
        run: pytest tests/unit/test_openai_constructed_resources.py -q

  sensor-sdk-floors:
    name: Sensor (Python 3.11, SDK floors)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The oldest anthropic, litellm and mcp releases the extras admit, and
    # openai 2.8.0, the oldest openai litellm 1.83.0 installs with (the
    # lock's sdk-floors group), on the oldest supported Python. The other
    # lanes install the newest releases of each line, so a test that needs
    # a newer SDK, or a sensor read that works on only some releases,
    # passes there and fails in a user's install of an older one. One
    # Python version: the SDK floors, not the interpreter, are what this
    # lane varies.
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      - name: Install the sensor with the oldest supported SDKs
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra test --extra anthropic --extra openai --group sdk-floors

      - name: Installed SDK versions
        run: pip list | grep -iE "^(anthropic|openai|litellm|httpx|mcp|pydantic) "

      - name: Unit tests
        run: pytest tests/unit -q -n auto

  sensor-llama-index-floor:
    name: Sensor (Python 3.11, LlamaIndex floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The oldest LlamaIndex the agent-workflow wrap supports (the lock's
    # llama-index-floor group: llama-index-core 0.14.0 on
    # llama-index-workflows 2.0.0). The framework lane installs the newest
    # releases, so a span the wrap reads differently on an older release
    # passes there and fails here. Only the wrap's tests run: the rest of
    # the suite is the other lanes'.
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      - name: Install the sensor with the oldest supported LlamaIndex
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra test --extra openai --group llama-index-floor

      - name: Installed LlamaIndex versions
        run: pip list | grep -iE "^(llama-index-core|llama-index-workflows|llama-index-llms-openai|openai) "

      - name: LlamaIndex wrap tests
        run: pytest tests/unit/test_interceptor_llama_index.py -q

  go:
    name: Go (ingestion, workers, api)
    runs-on: ubuntu-24.04
    # The job takes three to four minutes; twenty ends a build or a test
    # that hangs with its output, not at the six-hour default.
    timeout-minutes: 20
    # The service modules are also built one at a time, each from its
    # own directory, by the split test stack's containers (`go run
    # ./cmd/` with only that module mounted), where the root go.work
    # does not exist. With the workspace on, go.work.sum satisfies a
    # module whose own go.sum is incomplete and the gap only shows when
    # a container boots. Turning the workspace off here makes this job
    # see what the containers see; the root module uses its replace
    # directives.
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"

      - name: Install golangci-lint v2
        # Pinned to an immutable commit SHA (not a tag like @v2.11.4)
        # because tags can be re-pointed by anyone with push access to
        # the upstream repo without changing the version string. SHA
        # is the only anchor that survives an upstream tag rewrite.
        # Bump deliberately; keep the tag name in the comment for
        # human readability. Current pin: v2.14.0 (793d0531); v2.13 is
        # the first release line that type-checks Go 1.27.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@793d05316077345337ae9a11ae05ec8f23edfe1b

      # golangci-lint runs here without a config file, so no formatter
      # is enabled and unformatted files pass it. gofmt comes from the
      # toolchain setup-go installed above, the same Go release every
      # module's go.mod requires, so CI and a local `gofmt -l .` agree.
      # The workflow files themselves: expressions, runner labels, shell
      # in run: blocks. Pinned to a commit (rhysd/actionlint v1.7.12).
      - name: actionlint on the workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca -color .github/workflows/*.yml

      - name: Migration pairs (postgres and sqlite directories in step)
        run: |
          scripts/test-check-migration-pairs.sh
          scripts/check-migration-pairs.sh

      - name: gofmt (storage, ingestion, workers, api)
        run: |
          status=0
          for m in storage ingestion workers api; do
            unformatted="$(cd "$m" && gofmt -l .)"
            if [ -n "$unformatted" ]; then
              echo "::error::gofmt reports unformatted files in $m (run gofmt -w . there):"
              while IFS= read -r file; do echo "  $m/$file"; done <<<"$unformatted"
              status=1
            fi
          done
          exit "$status"

      - name: Lint storage
        working-directory: storage
        run: golangci-lint run ./... --timeout=5m

      - name: Lint ingestion
        working-directory: ingestion
        run: golangci-lint run ./... --timeout=5m

      - name: Lint workers
        working-directory: workers
        run: golangci-lint run ./... --timeout=5m

      - name: Lint api
        working-directory: api
        run: golangci-lint run ./... --timeout=5m

      - name: Install govulncheck
        # A module version is immutable once the Go checksum database
        # has recorded it, so a version pin is as fixed as a commit SHA.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      # govulncheck fails only on a vulnerability the code can reach;
      # advisories in a required module that no call path touches are
      # reported without failing the job.
      - name: Vulnerability scan (storage, ingestion, workers, api)
        run: |
          for m in storage ingestion workers api; do
            echo "::group::govulncheck $m"
            (cd "$m" && govulncheck ./...)
            echo "::endgroup::"
          done

      # The storage module's tests run every dialect and migration check
      # on SQLite here (a temp file per test, no server); the Postgres
      # half and the schema parity test run in the integration job's
      # `make test-go-db`, which has a Postgres.
      #
      # -race also turns on the compiler's checkptr instrumentation,
      # which makes the pure-Go SQLite (modernc.org/sqlite and the libc
      # it is transpiled against) about ten times slower per statement:
      # the ingestion store's write of its 10 000-record cap, 0.2 s
      # uninstrumented, then outlasts the 2 s StageTimeout it enforces.
      # checkptr is turned off for the modernc.org packages only, by
      # package pattern; the race detector stays on everywhere and
      # checkptr stays on for our own code. Every Go module whose
      # SQLite half runs under -race takes the same flag.
      - name: Test storage (SQLite)
        working-directory: storage
        run: go test ./... -v -race -count=1 -gcflags='modernc.org/...=-d=checkptr=0'

      - name: Test ingestion
        working-directory: ingestion
        run: |
          go test ./... -v -race \
            -gcflags='modernc.org/...=-d=checkptr=0' \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./internal/handlers/...

      - name: Check ingestion coverage threshold
        run: |
          cd ingestion
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | sed 's/%//')
          echo "Ingestion coverage (handlers): ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 67" | bc -l) )); then
            echo "FAIL: ${COVERAGE}% below 67%"
            exit 1
          fi
          echo "PASS: ${COVERAGE}% meets 67%"

      - name: Print ingestion coverage summary
        run: |
          cd ingestion
          go tool cover -func=coverage.out | tail -20

      - name: Generate ingestion HTML report
        if: always()
        run: |
          cd ingestion
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload ingestion coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-ingestion
          path: ingestion/coverage.html
          retention-days: 14

      - name: Test workers
        working-directory: workers
        run: |
          go test ./... -v -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./internal/...

      - name: Report workers coverage (no threshold)
        run: |
          cd workers
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}')
          echo "Workers coverage: ${COVERAGE}"
          echo "No threshold -- SQL paths covered by integration tests."
          go tool cover -func=coverage.out | tail -20

      - name: Generate workers HTML report
        if: always()
        run: |
          cd workers
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload workers coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-workers
          path: workers/coverage.html
          retention-days: 14

      - name: Test api
        working-directory: api
        run: |
          # Run every test package, not just ./tests/, so handler-package
          # tests in api/internal/handlers/ (mcp_policy_test.go,
          # mcp_policy_apply_template_test.go, mcp_policy_audit_log_test.go,
          # mcp_policy_metrics_templates_test.go, whoami_test.go) execute
          # and contribute to handler coverage. Restricting to ./tests/
          # left those files compiled-but-unrun, dragging the gate from
          # 67% to 52% on feat/mcp-protection-policy until PR #33.
          go test ./... -v -race \
            -coverprofile=coverage.out \
            -covermode=atomic \
            -coverpkg=./internal/handlers/...

      - name: Check api coverage threshold
        run: |
          cd api
          COVERAGE=$(go tool cover -func=coverage.out | grep "^total:" | awk '{print $3}' | sed 's/%//')
          echo "API coverage (handlers): ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 66" | bc -l) )); then
            echo "FAIL: ${COVERAGE}% below 66%"
            exit 1
          fi
          echo "PASS: ${COVERAGE}% meets 66%"

      - name: Print api coverage summary
        run: |
          cd api
          go tool cover -func=coverage.out | tail -20

      - name: Generate api HTML report
        if: always()
        run: |
          cd api
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload api coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: coverage-api
          path: api/coverage.html
          retention-days: 14

  flightdeck:
    # The one binary: the root module's lint and unit tests, the build
    # with the dashboard bundle embedded, and scripts/flightdeck-smoke.sh
    # on the default database (SQLite, nothing configured) and against a
    # Postgres service container: start, create the schema, serve the
    # dashboard, accept an event through the embedded bus and serve the
    # session back, stop cleanly, restart. The release's install gate
    # checks (scripts/install-gate.sh) run on the same binary.
    name: flightdeck binary
    runs-on: ubuntu-24.04
    # The job takes about ten minutes (npm ci, the dashboard build, the
    # lint, the -race tests that start the real binary, three smokes
    # and the install gate's checks);
    # twenty turns a start that wedges into a failure with its log
    # instead of a run that sits until the six-hour default.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flightdeck
          POSTGRES_PASSWORD: flightdeck_dev
          POSTGRES_DB: flightdeck
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flightdeck"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.sum
            go.work.sum
            storage/go.sum
            ingestion/go.sum
            workers/go.sum
            api/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Build the binary from a bare checkout (empty webui/dist)
        # A fresh clone has only webui/dist/.gitkeep; go:embed's pattern
        # must still match, so `go build` works before the dashboard is
        # built (the router then answers 503 with build instructions).
        run: |
          test -f webui/dist/.gitkeep
          test "$(find webui/dist -mindepth 1 -maxdepth 1 | wc -l)" = "1"
          go build -o /dev/null ./cmd/flightdeck

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build the dashboard bundle into webui/dist
        run: make build-webui

      - name: Install golangci-lint v2
        # Same pin as the Go job above.
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@793d05316077345337ae9a11ae05ec8f23edfe1b

      - name: gofmt and golangci-lint (root module)
        run: make lint-flightdeck

      - name: Unit tests (root module)
        # cmd/flightdeck's tests start the real binary (the test
        # executable re-executes itself) on SQLite: stop and restart,
        # kill and restart, a second instance, the fleet feed. The
        # child is built with -race too, hence the checkptr exemption
        # for the pure-Go SQLite, as in the Go job above.
        run: go test -race -count=1 -gcflags='modernc.org/...=-d=checkptr=0' ./cmd/... ./internal/... ./webui/...

      - name: Build bin/flightdeck
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=v$(cat VERSION)" -o bin/flightdeck ./cmd/flightdeck

      - name: Smoke the binary on its default database (SQLite)
        # No database URL: the first-run path of a user who configures
        # nothing.
        run: scripts/flightdeck-smoke.sh ./bin/flightdeck 127.0.0.1:4000

      - name: Smoke the binary against Postgres
        run: scripts/flightdeck-smoke.sh ./bin/flightdeck 'postgres://flightdeck:flightdeck_dev@127.0.0.1:5432/flightdeck?sslmode=disable' 127.0.0.1:4000

      - name: The install gate's checks on the built binary
        # scripts/install-gate.sh is what the install-gate workflow runs
        # against the published artifacts after a release; it runs here
        # on every pull request so it cannot rot between releases. First
        # as on every leg of the gate, with nothing configured (SQLite
        # in a fresh data dir, a restart that keeps the session), then as
        # on its one Postgres leg: on a database of its own, created
        # empty here, so the binary creates the schema as it does on the
        # gate (the smoke above has already migrated `flightdeck`).
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          scripts/install-gate.sh run 127.0.0.1:4000 ./bin/flightdeck
          docker exec "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -q -U flightdeck -d postgres -c 'CREATE DATABASE flightdeck_gate'
          GATE_EXPECT_DATABASE=Postgres scripts/install-gate.sh run 127.0.0.1:4000 ./bin/flightdeck \
            --database-url 'postgres://flightdeck:flightdeck_dev@127.0.0.1:5432/flightdeck_gate?sslmode=disable'

      - name: Concurrency smoke on SQLite
        # Twenty sessions of a hundred events each while four readers
        # hit the query API: every event stored once, no 5xx, no locked
        # database, the write-ahead log bounded, a clean stop. Sized to
        # finish in about a minute on a runner; the script's defaults
        # are the larger load its header describes.
        run: python3 scripts/flightdeck_stress.py ./bin/flightdeck --listen 127.0.0.1:4000 --sessions 20 --events 100 --readers 4

  dashboard:
    name: Dashboard (TypeScript)
    runs-on: ubuntu-24.04
    # About two minutes; fifteen bounds a hung test run.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # The dashboard ships inside the flightdeck binary: the cache and
      # security headers it is served with are the router's, pinned by
      # internal/router's tests (the `flightdeck binary` job), and the
      # image that carries it is built and run by the release snapshot
      # job.

  plugin:
    name: Plugin (Claude Code, node --test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The plugin is zero-dep (`agent_id.mjs` / `uuid5.mjs` /
      # `mcp_identity.mjs` use only Node built-ins — node:crypto,
      # node:test, the URL global, process.env). No npm install
      # step needed; the make target invokes `node --test` directly
      # against tests/*.test.mjs.
      # Run on the plugin's minimum supported Node (engines.node >=22)
      # and on the current LTS the rest of the repo builds with.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"

      - name: Plugin unit tests (Node 22)
        run: make test-plugin

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Plugin unit tests (Node 24)
        run: make test-plugin

  # Known-vulnerability scan of the npm (dashboard, plugin) and pip
  # (sensor) dependencies; the Go job's govulncheck covers the Go
  # modules and the release workflow's Trivy scan covers the images.
  # scripts/vuln_scan.py audits the lockfiles directly: npm audit reads
  # dashboard/package-lock.json, and pip-audit (an exact release that
  # uvx fetches into the uv cache) reads the pins exported from
  # sensor/uv.lock. Nothing is installed into the project. It fails on a
  # high or critical advisory in any dashboard dependency (dev ones build
  # or end up in the shipped bundle), on any advisory in the sensor's
  # core runtime dependencies, and on an expired ignore entry; lower
  # npm severities and the sensor's extras are reported in the log.
  # Excused advisories, each with a reason and an expiry date, live in
  # .github/vuln-ignore.toml. The script's own time budget stays under
  # this job's timeout.
  dependency-scan:
    name: Dependency vulnerability scan (npm, pip)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"

      - name: Scanner unit tests
        run: python3 -m unittest scripts/test_vuln_scan.py

      - name: Scan npm and pip dependencies
        run: python3 scripts/vuln_scan.py

  integration:
    # The suite runs against the dev stack (`make dev`: the flightdeck
    # binary built from this commit) on Postgres 16 (the default image),
    # on Postgres 18, the current major, and on SQLite. The Postgres 16
    # entry keeps the job's established name, which branch protection
    # requires. A fourth leg boots the split test stack (the three
    # services as separate containers) and runs the suite's `exclusive`
    # phase there: it holds the tests that pause the worker container,
    # which skip against the binary, where the workers are goroutines.
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    # A leg takes ten to fifteen minutes; forty turns a stack that
    # wedges into a failure with its log instead of a six-hour run.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Integration + sensor e2e
            slug: postgres-16
            stack: postgres
            postgres_image: postgres:16-alpine
            postgres_major: "16"
            postgres_data_dir: /var/lib/postgresql/data
          - name: Integration + sensor e2e (Postgres 18)
            slug: postgres-18
            stack: postgres
            postgres_image: postgres:18-alpine
            postgres_major: "18"
            postgres_data_dir: /var/lib/postgresql
          - name: Integration + sensor e2e (SQLite)
            slug: sqlite
            stack: sqlite
            postgres_image: postgres:16-alpine
            postgres_data_dir: /var/lib/postgresql/data
          - name: Integration (split services, worker pause)
            slug: split
            stack: split
            postgres_image: postgres:16-alpine
            postgres_data_dir: /var/lib/postgresql/data
    # No `needs:` on the unit jobs: this job boots its own stack and
    # shares nothing with them, so it starts as soon as the push lands
    # instead of queueing behind the slowest unit job, which cost about
    # four minutes of wall-clock per push. A unit failure still fails
    # the run on its own job.
    #
    # PYTHON: the Makefile defaults $(PYTHON) to
    # ./sensor/.venv/bin/python (single-venv discipline for local
    # dev). CI uses actions/setup-python directly without a project
    # venv, so we override here at the job level — every Make target
    # invoked below ($(PYTHON), $(MAKE) -C sensor, etc.) inherits this
    # without per-step overrides. One env-var, no per-step trap.
    #
    # FLIGHTDECK_DEV_WEBUI: the suite never loads the dashboard, so the
    # binary is built without the bundle (`/` answers 503) and the leg
    # skips npm ci and the dashboard build. The E2E shards build it.
    env:
      PYTHON: python
      FLIGHTDECK_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
      FLIGHTDECK_POSTGRES_DATA_DIR: ${{ matrix.postgres_data_dir }}
      FLIGHTDECK_DEV_WEBUI: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      - name: Install sensor with dev + provider extras
        working-directory: sensor
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra dev --extra anthropic --extra openai

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.sum
            go.work.sum
            storage/go.sum
            ingestion/go.sum
            workers/go.sum
            api/go.sum

      - name: Boot the dev stack (the binary from source, on ${{ matrix.stack }})
        id: boot
        if: ${{ matrix.stack != 'split' }}
        # `make dev` builds the binary, starts it (beside the Postgres
        # container on the Postgres legs) and returns once both health
        # endpoints answer, or fails with the end of the binary's log.
        run: make dev DB=${{ matrix.stack }}

      - name: The stack runs on the database this leg is for
        if: ${{ matrix.stack != 'split' }}
        # A leg that booted on another database than its name says
        # would pass for the wrong reason (the image variable not
        # reaching compose, DB= not reaching the script). The binary's
        # start-up block names its database, and the server its version.
        run: |
          if [ "${{ matrix.stack }}" = sqlite ]; then
            if ! grep -Eq '^ +Database +.*\(SQLite\)$' .dev/flightdeck.log; then
              echo "::error::the binary's log does not say it runs on SQLite"
              head -n 30 .dev/flightdeck.log
              exit 1
            fi
            names="$(docker ps --format '{{.Names}}')"
            case "$names" in
              *postgres*)
                echo "::error::a Postgres container runs on the SQLite leg"
                exit 1
                ;;
            esac
          else
            if ! grep -Eq '^ +Database +.*\(Postgres\)$' .dev/flightdeck.log; then
              echo "::error::the binary's log does not say it runs on Postgres"
              head -n 30 .dev/flightdeck.log
              exit 1
            fi
            version="$(docker exec docker-postgres-1 psql -U flightdeck -d flightdeck -tAc 'show server_version')"
            echo "Postgres server_version: $version"
            case "$version" in
              "${{ matrix.postgres_major }}".*) ;;
              *)
                echo "::error::this leg is for Postgres ${{ matrix.postgres_major }}, and the server is $version"
                exit 1
                ;;
            esac
          fi

      - name: Run integration tests (fabricated + sensor e2e)
        id: tests
        if: ${{ matrix.stack != 'split' }}
        # The test-integration target runs two phases: the parallel
        # phase under pytest-xdist for every test that keeps to its
        # own flavors and session ids, then the tests marked
        # `exclusive` one at a time. Both deselect manual tests;
        # test_ui_demo.py is the only manual-marked test today, a
        # 3-minute dashboard data-population tool, not a regression
        # test. The test_sensor_e2e.py file is part of the integration
        # directory, so its e2e tests run inside this step.
        #
        # -rs lists every skipped test with its reason at the end of
        # each phase: on the binary those are the worker-pause tests
        # (they run in the split leg), on SQLite the postgres_only
        # ones as well. The output is kept in a file for the evidence
        # steps below.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          make test-integration DB=${{ matrix.stack }} PYTEST_ADDOPTS=-rs 2>&1 | tee "$RUNNER_TEMP/evidence/test-output.log"

      - name: Boot the split test stack and run the exclusive phase on it
        id: split
        if: ${{ matrix.stack == 'split' }}
        # `make test-split` starts the stack (the three services compile
        # in their containers; compose waits for their health), seeds
        # the fixtures and runs the tests marked `exclusive`. The
        # worker-pause tests are among them and must run here, not
        # skip: the step fails when pytest reports the skip reason they
        # carry against a stack without a worker container.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          make test-split PYTEST_ADDOPTS=-rs 2>&1 | tee "$RUNNER_TEMP/evidence/test-output.log"
          if grep -q "pausing the worker needs" "$RUNNER_TEMP/evidence/test-output.log"; then
            echo "::error::a worker-pause test skipped on the split test stack"
            exit 1
          fi
          # No skip is not yet a pass: the four tests this leg exists
          # for must each be reported PASSED here, by name. They skip
          # on every other leg, so one that is renamed, loses its
          # marker or is deselected would otherwise run nowhere.
          for id in \
            tests/integration/test_prompt_capture.py::test_a_backlog_of_capture_on_sessions_keeps_every_calls_content \
            tests/integration/test_prompt_capture.py::test_content_published_before_its_session_start_keeps_its_content \
            tests/integration/test_session_states.py::test_backlog_of_reattachments_drains_to_the_right_states \
            tests/integration/test_session_states.py::test_a_call_published_after_the_end_cannot_keep_the_session_open; do
            if ! grep -Fq "$id PASSED" "$RUNNER_TEMP/evidence/test-output.log"; then
              echo "::error::$id was not reported PASSED on the split test stack"
              exit 1
            fi
          done

      # What a failure leaves behind, kept before anything else runs:
      # the test output, and the log of the stack (the binary's, or the
      # split stack's containers'). A leg once failed here on a runner
      # that then stopped answering, and nothing of it could be read;
      # these two steps upload within seconds of the tests ending, and
      # the step summary names the failed tests with the end of the log.
      - name: Collect the test output and the stack's log
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          if [ "${{ matrix.stack }}" = split ]; then
            docker compose -p flightdeck-split -f docker/docker-compose.split.yml logs --no-color \
              > "$RUNNER_TEMP/evidence/stack.log" 2>&1 || true
          else
            cp .dev/flightdeck.log "$RUNNER_TEMP/evidence/stack.log" 2>/dev/null || true
          fi
          if [ "${{ steps.tests.outcome }}" = failure ] || [ "${{ steps.split.outcome }}" = failure ]; then
            {
              echo "### ${{ matrix.name }}: the tests failed"
              echo
              echo '```'
              grep -E '^(FAILED|ERROR) |=+ .*(passed|failed|error)' "$RUNNER_TEMP/evidence/test-output.log" | cut -c 1-300 | head -60 || true
              echo '```'
              echo
              echo "The end of the stack's log (the whole of it is in the \`integration-evidence-${{ matrix.slug }}\` artifact):"
              echo
              echo '```'
              tail -n 80 "$RUNNER_TEMP/evidence/stack.log" | cut -c 1-400 || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the test output and the stack's log
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: integration-evidence-${{ matrix.slug }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14

      - name: Go tests that need Postgres or NATS
        # The Go tests that read TEST_POSTGRES_URL skip their Postgres
        # half in the Go job, which has no database. This step runs
        # them against this stack's Postgres container, so they run on
        # both majors the matrix covers, and runs the TEST_NATS_URL
        # tests against a NATS server the script starts.
        # scripts/go-db-tests.sh gives each package a fresh database
        # (init.sql seed, then the workers' migrate-only mode up to the
        # newest migration), runs the packages on Postgres and the
        # storage-converted ones on SQLite as well (a temp file per
        # test), fails on any skipped test in those packages, and fails
        # when a DB-gated package is missing from its lists. It runs
        # even when the integration tests failed, so the two results
        # stay independent, but not when the stack never booted.
        if: ${{ !cancelled() && matrix.stack == 'postgres' && steps.boot.outcome == 'success' }}
        run: make test-go-db

      - name: Dump the stack's logs on failure
        if: failure()
        # Bounded, like the teardown below: a runner that stops
        # answering after a failure must end the job here, with the
        # failing step's output, not at the job's forty minutes.
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.stack }}" = split ]; then
            docker compose -p flightdeck-split -f docker/docker-compose.split.yml ps -a || true
            docker compose -p flightdeck-split -f docker/docker-compose.split.yml logs --tail=300 || true
          else
            scripts/dev-stack.sh dump || true
          fi

      - name: Tear down stack
        if: always()
        timeout-minutes: 5
        run: |
          if [ "${{ matrix.stack }}" = split ]; then
            make down-split || true
          else
            make down || true
          fi

  e2e-shard:
    name: E2E (Playwright) shard ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    # A shard takes five to eight minutes: it builds the dashboard
    # bundle and the binary (`make dev`), then runs its quarter of the
    # suite. Thirty ends a stack or a browser that wedges with the
    # shard's log and reports instead of a six-hour run.
    timeout-minutes: 30
    # Rule 40c: browser end-to-end tests run parallel to the integration
    # job, with no `needs:` on the unit jobs: each shard boots its own
    # stack and shares nothing with them. The suite (both theme
    # projects) is split into four shards, one runner each; each shard
    # seeds the canonical fixture dataset into its own Postgres, which
    # is why the stack is per shard. The "E2E (Playwright)" job below
    # merges the shards' reports and is the check branch protection
    # requires.
    #
    # The stack is the dev stack on Postgres: the flightdeck binary built
    # from this commit with the dashboard's production bundle embedded,
    # so the suite tests the bundle users get, served the way they get
    # it. Postgres because the seeder and three spec files write to the
    # database with Postgres SQL (dashboard/tests/e2e/README.md).
    #
    # PYTHON: same job-level override as the integration job above —
    # the Makefile's $(PYTHON) default points at the local sensor/.venv
    # which CI doesn't create. ``make seed-e2e`` resolves through this.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.24"
          enable-cache: true
          cache-dependency-glob: sensor/uv.lock

      - name: Install sensor (required by seed.py's event-builder helpers)
        # tests/shared/fixtures.py imports
        # flightdeck_sensor.core.agent_id.derive_agent_id. Without the
        # install the seeder crashes before POSTing anything.
        working-directory: sensor
        env:
          UV_PROJECT_ENVIRONMENT: ${{ env.pythonLocation }}
        run: uv sync --locked --inexact --extra dev --extra anthropic --extra openai

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.sum
            go.work.sum
            storage/go.sum
            ingestion/go.sum
            workers/go.sum
            api/go.sum

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      # The browser comes from the Playwright CDN. `--with-deps` would
      # also install Chromium's system libraries and fonts through apt,
      # but the runner image already carries what Chromium needs, and
      # the hosted runners have lost name resolution for the Ubuntu
      # archive for hours at a time: apt then spends ten minutes timing
      # out and the shard fails without running a test. So the system
      # packages are installed only when the browser does not start
      # without them, and the launch check runs again afterwards. The
      # check starts the same binary the suite uses (the `chromium`
      # channel of playwright.config.ts, not the headless shell).
      - name: Install Playwright browsers
        working-directory: dashboard
        run: |
          npx playwright install chromium
          launch_check() {
            node -e "
              const { chromium } = require('@playwright/test');
              chromium.launch({ channel: 'chromium' }).then(async (browser) => {
                const page = await browser.newPage();
                await page.setContent('<title>ok</title>');
                if ((await page.title()) !== 'ok') throw new Error('Chromium started but did not render');
                await browser.close();
              }).catch((err) => { console.error(err); process.exit(1); });
            "
          }
          if ! launch_check; then
            echo "::warning::Chromium did not start on the runner image alone; installing its system packages"
            npx playwright install-deps chromium
            launch_check
          fi

      - name: Boot the dev stack, the dashboard bundle embedded in the binary
        # `make dev` builds the bundle (the dependencies are installed
        # above), builds the binary around it and returns once it
        # serves.
        run: make dev

      - name: Seed canonical E2E fixtures
        # Idempotent; runs here explicitly so a failure at seed time
        # surfaces as its own job step rather than hiding inside
        # Playwright's globalSetup stdout. globalSetup will re-run
        # (and skip) during the playwright test invocation below.
        run: make seed-e2e

      - name: Run Playwright tests, shard ${{ matrix.shard }}/4 (neon-dark + clean-light)
        working-directory: dashboard
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload the shard's blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: dashboard/blob-report/
          retention-days: 14

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: dashboard/test-results/
          retention-days: 14

      # The binary's log of the whole shard, on every run: a test that
      # fails its first attempt and passes on retry leaves a trace in
      # the report, and this is what the stack logged at that second
      # (its lines carry UTC wall-clock times). .dev is a hidden
      # directory, which the upload action skips, hence the copy.
      - name: Keep the binary's log
        id: stacklog
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          cp .dev/flightdeck.log "$RUNNER_TEMP/evidence/flightdeck.log" 2>/dev/null || true

      - name: Upload the binary's log
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: e2e-stack-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 14

      - name: Dump the stack's logs on failure
        if: failure()
        timeout-minutes: 5
        run: scripts/dev-stack.sh dump || true

      - name: Tear down stack
        if: always()
        timeout-minutes: 5
        run: make down || true

  e2e:
    name: E2E (Playwright)
    # The required check: passes only when every shard passed, and
    # merges the shards' blob reports into one HTML report.
    needs: e2e-shard
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    # About a minute: download the shards' reports, merge them, list the
    # retried tests. Ten bounds a download or an npm ci that hangs.
    timeout-minutes: 10
    env:
      # How many tests may pass only on a retry before the job fails.
      # Every such test is listed in the job summary and gets a warning
      # annotation whatever this number is. It is not 0: the one retry
      # exists to absorb a real infrastructure blip (a runner that
      # stalls for a second), and at 0 one unlucky test in an unrelated
      # pull request would turn it red. Of 105 runs before this step
      # existed, 19 had one such test, 2 had two and none had more, so
      # more than two in one run is not one unlucky test: it is the
      # stack or the change under test.
      E2E_MAX_RETRIED_TESTS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Download the shards' blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: blob-report-*
          path: dashboard/all-blob-reports
          merge-multiple: true

      - name: Merge into one HTML report
        working-directory: dashboard
        # The JSON report beside it is what the retried-tests step reads.
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/e2e-merged-report.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Upload the HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: dashboard/playwright-report/
          retention-days: 14

      # A test that fails its first attempt and passes on the retry
      # leaves every shard green, and nothing else says it happened.
      # This step names each one in the job summary and as a warning
      # annotation, and fails above E2E_MAX_RETRIED_TESTS. The traces of
      # the failed attempts are in the report uploaded above.
      - name: Tests that passed only on a retry
        run: |
          python3 scripts/e2e_retried_tests.py "$RUNNER_TEMP/e2e-merged-report.json" \
            --summary "$GITHUB_STEP_SUMMARY" --max "$E2E_MAX_RETRIED_TESTS"

      - name: Every shard passed
        run: |
          if [ "${{ needs.e2e-shard.result }}" != success ]; then
            echo "an E2E shard did not pass: ${{ needs.e2e-shard.result }}"
            exit 1
          fi

  # Helm chart lint + render. scripts/helm-chart-test.sh renders the
  # chart in every shape it supports (one pod on SQLite, one pod on
  # Postgres, several pods on Postgres and a shared NATS, the HPA, the
  # production values) and checks what comes out, then renders every
  # combination it must refuse (several pods on SQLite or without a
  # shared bus, a bundled Postgres without a password or with too few
  # connections, a NATS cluster without a usable token, stream settings
  # the pods would refuse) and checks the message. Every branch is
  # checked explicitly so a refactor that drops a guard fails here. No
  # cluster: `helm lint` and `helm template` only.
  helm:
    name: Helm chart lint
    runs-on: ubuntu-24.04
    # Under a minute: lint, and the chart test's renders and refusals.
    # Ten bounds a download of Helm that hangs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
        with:
          version: v3.16.2

      # Validates every shape the chart test renders against the
      # Kubernetes schemas (strict: an unknown field fails). Pinned by
      # version, and the archive checked against the checksum the
      # release publishes before anything in it runs.
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: helm lint, every supported shape and every refusal, and their schemas
        env:
          REQUIRE_KUBECONFORM: "1"
        run: scripts/helm-chart-test.sh

  # Schema-validate the Claude Code plugin marketplace manifest. The
  # plugin install path (``/plugin marketplace add flightdeckhq/flightdeck``
  # then ``/plugin install flightdeck@flightdeck-plugins``) reads
  # .claude-plugin/marketplace.json directly; a malformed schema would
  # silently break the one-command install. Validates JSON + required
  # fields (name, version, plugins[].source.ref) so a future bump that
  # forgets to update the ref pinning surfaces in CI rather than at
  # install time. The job also runs the checks of the repository's own
  # scripts (version locations, the pricing refresh, the README command
  # budget), which is why its display name is wider than its id.
  marketplace-schema:
    name: Repo scripts and manifests
    runs-on: ubuntu-24.04
    # About two minutes of script tests, each with a bound of its own;
    # fifteen covers a slow runner.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Every file that carries the release version (sensor, plugin,
      # marketplace pin, Helm chart and image tag, guides/self-hosting.md,
      # Swagger) must
      # match the root VERSION file; scripts/version.py lists them.
      - name: Version locations match VERSION
        run: |
          python3 scripts/version.py check
          python3 -m unittest scripts/test_version.py

      - name: Pricing catalogue refresh script
        run: python3 -m unittest scripts/test_pricing_refresh.py

      # The seed that fills a throwaway Flightdeck for the README's
      # images (scripts/demo_seed.py), against a fake server: its
      # events are the same on every run, carry the identity ingestion
      # requires and no content, and name only invented hosts and users.
      - name: Demo seed script
        run: python3 -m unittest scripts/test_demo_seed.py

      # The script that photographs the seeded instance needs a browser
      # and a running flightdeck, so CI only checks that it parses.
      - name: README image script parses
        run: node --check scripts/readme_images.mjs

      # The release notes come from CHANGELOG.md; the installers and the
      # install gate's checks are shell the release depends on. The
      # runner's shellcheck is the one Ubuntu ships.
      - name: Release notes script and shell installers
        run: |
          python3 -m unittest scripts/test_release_notes.py
          python3 -m unittest scripts/test_e2e_retried_tests.py
          python3 scripts/release_notes.py "v$(cat VERSION)" >/dev/null
          python3 scripts/release_notes.py "v$(cat VERSION)-rc.1" >/dev/null
          shellcheck --version | head -2
          shellcheck -s sh install.sh
          shellcheck scripts/install-gate.sh scripts/test-install-gate.sh scripts/test-install-sh.sh \
            scripts/check-script-modes.sh scripts/test-check-script-modes.sh
          shellcheck scripts/check-installer-copies.sh scripts/test-check-installer-copies.sh

      # A script the Makefile or a workflow runs by its path must be
      # committed executable (git mode 100755): one that is not runs on
      # its author's checkout and fails with "Permission denied" on a
      # fresh clone. The self-test pins the rule on fixture repositories,
      # then the repository is checked.
      - name: Scripts run by path are executable
        run: |
          scripts/test-check-script-modes.sh
          scripts/check-script-modes.sh

      # The README's install command fetches the installer from the
      # project's site, which GitHub Pages serves from docs/ as static
      # files: docs/install.sh and docs/install.ps1 are copies of the
      # root installers. A copy that differs from its source fails here
      # (`make installer-copies` refreshes them), so the site never
      # serves an installer other than the one tested below.
      - name: The site's installer copies match the root installers
        run: |
          scripts/test-check-installer-copies.sh
          scripts/check-installer-copies.sh

      # The scripts the dev stack, the integration job and the chart and
      # compose checks run.
      - name: shellcheck on the dev stack, chart and compose scripts
        run: |
          shellcheck scripts/dev-stack.sh scripts/test-dev-stack.sh scripts/go-db-tests.sh \
            scripts/helm-chart-test.sh scripts/compose-smoke.sh scripts/check-compose-projects.sh

      # The dev stack script on the paths where a mistake costs a
      # running stack or a database: a failing build, the move from the
      # seven-container stack, a busy port, another checkout's
      # containers, and every way `reset` refuses. It runs the script
      # for real against a fake docker, go and flightdeck.
      - name: The dev stack script against fakes
        run: scripts/test-dev-stack.sh

      # A compose file with no project name of its own renders as
      # project `docker`, the dev stack's, and shares its volumes.
      - name: Every compose file renders under its own project
        run: scripts/check-compose-projects.sh

      # install.sh end to end against a local server with the release
      # layout (a fake archive): latest, a pinned VERSION, the fallback
      # install dir, and the refusals (bad checksum, missing checksum
      # entry, unsupported CPU, unknown version, plain-HTTP host).
      - name: install.sh against a local release server
        run: scripts/test-install-sh.sh

      # The install gate's checks against fake binaries, each broken in
      # one way the gate must catch (exits at once, never listens and
      # ignores SIGINT, never serves the session, needs no token, will
      # not stop, forgets the session over a restart): every one must
      # fail the gate within a bound, never hang it, and a fake that
      # behaves must pass. The `flightdeck` job runs the gate against
      # the real binary.
      - name: The install gate's checks against fake binaries
        run: scripts/test-install-gate.sh

      # The PyPI wheels (flightdeck-cli) are built by a script, not a
      # build backend; its tests pin the wheel layout, tags and RECORD.
      # discover mode: the directory is named packaging/, which a module
      # path would resolve to the packaging library.
      - name: PyPI wheel builder
        run: python3 -m unittest discover -s packaging/pypi -p 'test_*.py'

      # The same ruff the sensor pins (sensor/uv.lock), with the sensor's
      # configuration, so the packaging code follows the repository's
      # Python rules; and the builder's output must pass twine's
      # metadata check and build byte-identical wheels twice.
      - name: ruff, twine and reproducibility of the wheel builder
        run: |
          pip install --quiet ruff==0.17.1 twine==7.0.0
          ruff check --config sensor/pyproject.toml packaging/pypi scripts/release_notes.py scripts/test_release_notes.py \
            scripts/e2e_retried_tests.py scripts/test_e2e_retried_tests.py scripts/demo_seed.py scripts/test_demo_seed.py
          ruff format --check --config sensor/pyproject.toml packaging/pypi scripts/release_notes.py scripts/test_release_notes.py \
            scripts/e2e_retried_tests.py scripts/test_e2e_retried_tests.py scripts/demo_seed.py scripts/test_demo_seed.py
          printf '#!/bin/sh\necho stub\n' > "$RUNNER_TEMP/flightdeck"
          for n in 1 2; do
            python3 packaging/pypi/build_wheels.py --binary "$RUNNER_TEMP/flightdeck" --platform linux/amd64 \
              --tag "v$(cat VERSION)" --out "$RUNNER_TEMP/wheels-$n" --source-date-epoch 1767322800
          done
          twine check --strict "$RUNNER_TEMP"/wheels-1/*.whl
          cmp "$RUNNER_TEMP"/wheels-1/*manylinux*.whl "$RUNNER_TEMP"/wheels-2/*manylinux*.whl
          cmp "$RUNNER_TEMP"/wheels-1/*musllinux*.whl "$RUNNER_TEMP"/wheels-2/*musllinux*.whl

      # The README's command budget (scripts/readme-budget.sh): the
      # self-test pins the counting rule on fixtures, then the README
      # is measured and the step fails when it is over: a second
      # command in the install block, a third visible command under
      # Install, a fifth under Connect your agents, a seventh under
      # Self-hosting, more than 20 in all (the channels folded in
      # <details> included) or more than 300 lines.
      - name: README command budget
        run: |
          scripts/test-readme-budget.sh
          scripts/readme-budget.sh

      - name: Validate marketplace.json structure
        run: |
          python3 - <<'PY'
          import json, sys
          path = ".claude-plugin/marketplace.json"
          with open(path) as f:
              data = json.load(f)
          errors = []
          for key in ("name", "description", "owner", "plugins"):
              if key not in data:
                  errors.append(f"top-level key missing: {key}")
          if not isinstance(data.get("plugins"), list) or not data["plugins"]:
              errors.append("plugins[] must be a non-empty list")
          for i, p in enumerate(data.get("plugins", [])):
              for key in ("name", "description", "version", "source"):
                  if key not in p:
                      errors.append(f"plugins[{i}] missing key: {key}")
              src = p.get("source", {})
              for key in ("source", "url", "path", "ref"):
                  if key not in src:
                      errors.append(f"plugins[{i}].source missing key: {key}")
              # Pin ref to a tag (vX.Y.Z) — moving refs like ``main``
              # would silently change installable surface on every commit.
              ref = src.get("ref", "")
              if not ref.startswith("v") or ref.count(".") != 2:
                  errors.append(f"plugins[{i}].source.ref must be a tag (vX.Y.Z); got {ref!r}")
              # plugin version must match the source.ref tag (drift
              # surfaces as installing an artefact whose package version
              # disagrees with its git ref).
              version = p.get("version", "")
              if ref != "v" + version:
                  errors.append(f"plugins[{i}].version ({version!r}) must match source.ref ({ref!r}) sans 'v'")
          if errors:
              print("marketplace.json validation errors:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print(f"marketplace.json OK: {len(data['plugins'])} plugin(s) validated")
          PY

  # install.ps1 on Windows, on every pull request rather than first on a
  # release tag: the install gate runs it only after a release is
  # published. PSScriptAnalyzer as the gate runs it, then
  # scripts/test-install-ps1.ps1 (the installer piped through iex
  # against a local server with the release layout: checksum, the user
  # PATH and its registry type, the caller's session left as it was,
  # the refusals) under Windows PowerShell 5.1, which every Windows
  # has, and under PowerShell 7. The test writes a throwaway registry
  # key; -UseRealRegistry adds a run against the runner's real
  # HKCU\Environment, the code path users get.
  installer-windows:
    name: Installer on Windows (PowerShell 5.1 and 7)
    runs-on: windows-2022
    # Two runs of a script that takes seconds; fifteen minutes fails a
    # hung server or download long before the six-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The test serves the release layout with `python -m http.server`.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      # The same analysis as the install gate's, with the same rule left
      # out (the gate's comment says why).
      - name: PSScriptAnalyzer on install.ps1
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $findings | Format-Table -AutoSize | Out-String | Write-Host
          if ($findings) { throw "PSScriptAnalyzer: $($findings.Count) finding(s) in install.ps1" }

      - name: install.ps1 under Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/test-install-ps1.ps1 -Port 8766 -UseRealRegistry

      - name: install.ps1 under PowerShell 7
        shell: pwsh
        run: ./scripts/test-install-ps1.ps1 -Port 8767 -UseRealRegistry

  # The release build on every pull request, without publishing:
  # goreleaser cross-compiles the six binaries (.goreleaser.yaml) and
  # the all-in-one Docker image is built from the root Dockerfile, so a
  # platform or an image that stops building fails here and not on the
  # tag. The binaries are not run: the `flightdeck` job above smokes the
  # native build on SQLite and against Postgres. The image is run, the
  # way its header documents: a port, a volume and no database.
  release-snapshot:
    name: Release snapshot (six binaries, Docker image)
    runs-on: ubuntu-24.04
    # Four to five minutes: six binaries, the image, and the compose
    # smoke on it. Thirty bounds a build or a container that hangs.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # goreleaser reads the tags for the snapshot version.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: "1.27.4"
          cache-dependency-path: |
            go.sum
            go.work.sum
            ingestion/go.sum
            workers/go.sum
            api/go.sum

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"

      - name: Install dashboard dependencies
        working-directory: dashboard
        run: npm ci

      - name: Cross-build the six binaries
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          # Pinned: the release workflow must run the same goreleaser.
          version: v2.20.0
          args: build --snapshot --clean

      - name: Every target is present and the native one runs
        run: |
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            ls dist/flightdeck_${target}*/flightdeck >/dev/null
          done
          ls dist/flightdeck_windows_amd64*/flightdeck.exe dist/flightdeck_windows_arm64*/flightdeck.exe >/dev/null
          native=(./dist/flightdeck_linux_amd64*/flightdeck)
          "${native[0]}" --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build the all-in-one image (linux/amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          load: true
          tags: flightdeck:ci
          build-args: |
            VERSION=v${{ github.sha }}

      - name: The image runs as non-root and prints its version
        run: |
          test "$(docker image inspect flightdeck:ci --format '{{.Config.User}}')" = "nonroot"
          docker run --rm flightdeck:ci --version | grep -q "flightdeck v${{ github.sha }}"

      # The install gate's container checks (scripts/install-gate.sh, as
      # the install-gate workflow runs them on the published image): a
      # new named volume and no database, so the start-up block must
      # name SQLite in /data, and no data-dir warning, so /data is 0700
      # for the runtime user. The first container has a read-only root:
      # everything the binary writes is under /data. The second, on the
      # same volume, must serve the first one's session to the same token.
      - name: The image runs with no database and keeps its data on the volume
        env:
          GATE_STATE_FILE: ${{ runner.temp }}/image-gate.state
        run: |
          docker run -d --name flightdeck --read-only -p 127.0.0.1:4002:4000 -v flightdeck-ci:/data flightdeck:ci
          scripts/install-gate.sh check http://127.0.0.1:4002 docker logs flightdeck
          # The image's HEALTHCHECK is `flightdeck health`, the binary
          # probing itself (the image has no shell or curl). Docker runs
          # the first check ten seconds after the start; a minute is the
          # image's own start period. The same command by hand must
          # agree.
          deadline=$((SECONDS + 60))
          until [ "$(docker inspect flightdeck --format '{{.State.Health.Status}}')" = "healthy" ]; do
            if ((SECONDS >= deadline)); then
              echo "the container is not healthy after 60s:"
              docker inspect flightdeck --format '{{json .State.Health}}'
              exit 1
            fi
            sleep 1
          done
          docker exec flightdeck flightdeck health
          docker stop -t 30 flightdeck
          test "$(docker inspect flightdeck --format '{{.State.ExitCode}}')" = "0"
          docker rm flightdeck
          docker run -d --name flightdeck -p 127.0.0.1:4002:4000 -v flightdeck-ci:/data flightdeck:ci
          scripts/install-gate.sh kept http://127.0.0.1:4002 docker logs flightdeck
          docker stop -t 30 flightdeck
          test "$(docker inspect flightdeck --format '{{.State.ExitCode}}')" = "0"

      # The compose files users run (docker/docker-compose.yml alone, on
      # SQLite, and with docker-compose.postgres.yml), on the image just
      # built: up, the token read the way the file's header says, one
      # event in and its session out, down and up again with the token
      # and the session kept, and the overlay refused without a
      # password. Ports 4003; projects of its own, removed at the end.
      - name: The compose files run the image and keep its data across down and up
        run: scripts/compose-smoke.sh flightdeck:ci
