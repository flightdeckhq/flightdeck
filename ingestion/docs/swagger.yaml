          description: media type or content encoding not supported
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
            application/x-protobuf:
              schema:
                $ref: '#/components/schemas/handlers.OTLPStatus'
          description: token's minute budget spent, or too little of it left for the
