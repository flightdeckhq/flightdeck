# Flightdeck as one container: the `flightdeck` binary (ingestion API,
# workers, query API, embedded NATS and the dashboard in one process)
# on SQLite, with everything it writes on the `flightdeck_data` volume
# (the `data` volume of the project named below).
#
#   docker compose -f docker/docker-compose.yml up -d
#
# The dashboard is then at http://localhost:4000, ingestion at
# http://localhost:4000/ingest.
#
# The token. Inside the container the binary listens on :4000, which
# is not a loopback address, so the development token is refused: the
# first start mints an access token and keeps it in /data/secrets.json
# for the next starts. Read it with
#
#   curl -s http://localhost:4000/runtime-config.json
#
# That is what the dashboard itself loads; the start-up block in the
# container's log also prints the token, on the first start only. It is
# why the port is published on 127.0.0.1 by default: whoever can reach
# the origin can read the token. Set FLIGHTDECK_PUBLISH_HOST=0.0.0.0
# only behind a firewall or a proxy that authenticates, and set
# FLIGHTDECK_ALLOWED_HOSTS to the names it is then reached by (a LAN
# name, the proxy's host): the container answers only localhost and IP
# addresses unless they are listed, and answers any other name 421.
#
# Postgres instead of SQLite: add docker-compose.postgres.yml (a
# bundled Postgres and the database URL), or set
# FLIGHTDECK_DATABASE_URL to a Postgres you run.
#
# TLS from the binary: set FLIGHTDECK_DOMAIN to the public host name
# and publish ports 80 and 443 of the service from an override file;
# the binary then serves HTTPS on 443 with a Let's Encrypt certificate
# and no longer listens on 4000.
#
# Variables (shell environment, or docker/.env; see .env.example):
#   FLIGHTDECK_IMAGE         the image (default: this release's)
#   FLIGHTDECK_PUBLISH_HOST  host address the port is published on (127.0.0.1)
#   FLIGHTDECK_PUBLISH_PORT  host port (4000); the container always listens on 4000
#   FLIGHTDECK_DATABASE_URL  a Postgres URL; empty keeps SQLite in /data
#   FLIGHTDECK_DOMAIN        public host name for TLS; empty serves plain HTTP
#   FLIGHTDECK_ALLOWED_HOSTS host names answered besides localhost and IP
#                            addresses, comma separated (localhost)
#   FLIGHTDECK_NATS_STREAM_MAX_AGE_HOURS, FLIGHTDECK_NATS_STREAM_MAX_SIZE_MIB
#                            how long, and up to what size, the bus keeps
#                            events (72 hours, 5120 MiB)
#
# Health: the image's HEALTHCHECK runs `flightdeck health`, the binary
# probing its own /api/health and /ingest/health (the image has no
# shell or curl), so `docker compose ps` shows the service healthy once
# it serves, and another service can wait for it with
# `depends_on: {flightdeck: {condition: service_healthy}}`.
#
# Host names: the container answers only localhost, IP addresses and
# the names in FLIGHTDECK_ALLOWED_HOSTS (default: localhost), so a page
# on another site cannot reach it through a browser under a name of its
# own. The published port is reached as 127.0.0.1 or localhost. Reached
# by any other name (a LAN name, a reverse proxy's host, this service's
# name from another container, http://flightdeck:4000), list it, comma
# separated, in docker/.env: FLIGHTDECK_ALLOWED_HOSTS=localhost,flightdeck

# A fixed project name: the containers and volumes are named the same
# whichever directory the file is run from, and never collide with the
# contributor dev stack's project (`docker`, docker-compose.dev.yml).
name: flightdeck

services:
  flightdeck:
    image: ${FLIGHTDECK_IMAGE:-flightdeckhq/flightdeck:v0.9.0}
    restart: unless-stopped
    ports:
      - "${FLIGHTDECK_PUBLISH_HOST:-127.0.0.1}:${FLIGHTDECK_PUBLISH_PORT:-4000}:4000"
    volumes:
      - data:/data
    environment:
      FLIGHTDECK_DATABASE_URL: ${FLIGHTDECK_DATABASE_URL:-}
      FLIGHTDECK_DOMAIN: ${FLIGHTDECK_DOMAIN:-}
      # The names the container answers for besides localhost and IP
      # addresses (the image's default is localhost alone); see above.
      FLIGHTDECK_ALLOWED_HOSTS: ${FLIGHTDECK_ALLOWED_HOSTS:-localhost}
      # The FLIGHTDECK stream's limits, which the binary applies to the
      # stream at startup. The stream keeps processed and unprocessed
      # events alike until a limit removes the oldest, so events the
      # workers have not processed are lost when they are down longer
      # than the age limit or fall further behind than the size limit.
      # The store is on the data volume, beside the database.
      FLIGHTDECK_NATS_STREAM_MAX_AGE_HOURS: ${FLIGHTDECK_NATS_STREAM_MAX_AGE_HOURS:-72}
      FLIGHTDECK_NATS_STREAM_MAX_SIZE_MIB: ${FLIGHTDECK_NATS_STREAM_MAX_SIZE_MIB:-5120}
    # Log rotation. Docker's json-file driver otherwise keeps the
    # container's whole output in one file that grows until the disk is
    # full, and the workers log a line for every event they drop, so a
    # flood of bad events would fill the host disk through the log
    # alone. 20 MiB and five files (100 MiB) are the defaults of
    # Docker's own rotating `local` driver; json-file is kept over
    # `local` because `docker logs` reads both while log shippers that
    # tail container files read only json-file. A daemon-wide log-opts
    # in /etc/docker/daemon.json does not override it.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  data:
