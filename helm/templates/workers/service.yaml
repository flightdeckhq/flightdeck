{{- $component := "workers" -}}
{{- /*
Headless record for the workers pods. Its one port is the metrics
listener, so a scraper (or a ServiceMonitor) can find every worker
through it; with the listener off (workers.metricsPort=0) there is
nothing to route to and the Service carries a placeholder port.
*/ -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" $component) }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 4 }}
  ports:
    {{- if gt (int .Values.workers.metricsPort) 0 }}
    - name: metrics
      port: {{ .Values.workers.metricsPort }}
      targetPort: metrics
      protocol: TCP
    {{- else }}
    - name: noop
      port: 1
      targetPort: 1
    {{- end }}
