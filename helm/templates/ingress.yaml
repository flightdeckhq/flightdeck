{{- if .Values.ingress.enabled -}}
{{- /*
One rule, one path: the binary routes the dashboard (/), the query API
(/api) and the ingestion API (/ingest) itself, and the paths are
forwarded unchanged, so no rewrite annotation is needed.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flightdeck.fullname" . }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "ingress") | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "flightdeck.componentName" (dict "root" . "component" "flightdeck") }}
                port:
                  number: {{ .Values.flightdeck.service.port }}
{{- end }}
