{{- if .Values.networkPolicy.enabled }}
{{- /*
Security hardening: restrict who may reach the stateful backends. Only
the flightdeck pods may reach Postgres, and only they (plus the NATS
peers on the cluster port) may reach the NATS cluster, so another pod in
the cluster can neither read the database nor publish on the bus.
Requires a CNI that enforces NetworkPolicy (Calico, Cilium, etc.);
disable via networkPolicy.enabled on clusters without one.
*/ -}}
{{- if include "flightdeck.postgresBundled" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" "postgres") }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "flightdeck.selectorLabels" (dict "root" . "component" "flightdeck") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.postgres.port }}
{{- end }}
{{- if include "flightdeck.natsEnabled" . }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" "nats") }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" "nats") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "component" "nats") | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Client port: the flightdeck pods, which publish and consume.
    - from:
        - podSelector:
            matchLabels:
              {{- include "flightdeck.selectorLabels" (dict "root" . "component" "flightdeck") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.nats.clientPort }}
    # Cluster port: NATS peers only (replicas > 1).
    - from:
        - podSelector:
            matchLabels:
              {{- include "flightdeck.selectorLabels" (dict "root" . "component" "nats") | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.nats.clusterPort }}
{{- end }}
{{- end }}
