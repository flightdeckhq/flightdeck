{{- if and .Values.flightdeck.metrics.enabled .Values.flightdeck.metrics.networkPolicy.enabled }}
{{- $component := "flightdeck" -}}
{{- /*
The metrics ports carry no auth. This policy lets only the peers in
flightdeck.metrics.networkPolicy.from reach them, and keeps the port of
the dashboard and the APIs open to everyone: a NetworkPolicy that
selects a pod denies every ingress it does not allow, so the open port
is stated too. Requires a CNI that enforces NetworkPolicy.
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flightdeck.componentName" (dict "root" . "component" (printf "%s-metrics" $component)) }}
  labels:
    {{- include "flightdeck.labels" (dict "root" . "component" $component) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "flightdeck.selectorLabels" (dict "root" . "component" $component) | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ .Values.flightdeck.port }}
    - from:
        {{- toYaml .Values.flightdeck.metrics.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9102
        - protocol: TCP
          port: 9103
        - protocol: TCP
          port: 9104
{{- end }}
