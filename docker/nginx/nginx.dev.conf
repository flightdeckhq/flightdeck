# nginx 1.29.7+ keeps idle connections to every upstream open by
# default (HTTP/1.1, no Connection header) and closes them after
# keepalive_timeout. That must be shorter than each backend's own idle
# timeout (ingestion 60s, api 120s; in dev the dashboard is the Vite
# dev server, whose Node HTTP server closes idle connections after 5s):
# if the backend closes first, a request nginx writes onto the dead
# connection fails with a 502, and a POST is not retried. 50s stays
# under the Go services; the dashboard gets 4s.
upstream dashboard {
    server dashboard:3000;
    keepalive_timeout 4s;
}

upstream api {
    server api:8081;
    keepalive_timeout 50s;
}

upstream ingestion {
    server ingestion:8080;
    keepalive_timeout 50s;
}

server {
    listen 4000;
    server_name _;

    # Retry upstream on connection errors (safety net during startup)
    proxy_connect_timeout 2s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 10;
    proxy_next_upstream_timeout 30s;

    # /investigate -> /events permanent redirect. Preserves any
    # operator bookmarks, blog posts, and saved links that point
    # at the legacy route. 301 is the durable answer here (browsers
    # cache the rewrite so subsequent navigations skip the round-
    # trip). ``$is_args$args`` carries any query string through so
    # deep links like /investigate?agent_id=<uuid> resolve correctly.
    # Mirrors the same redirect in nginx.prod.conf so dev and prod
    # stay byte-identical on this contract.
    location = /investigate {
        return 301 /events$is_args$args;
    }

    # Dashboard
    location / {
        proxy_pass http://dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Query API. The path is forwarded as sent (no URI on proxy_pass):
    # the API serves its routes under /api, so a redirect it builds from
    # the request keeps the prefix, as behind the Helm chart's Ingress.
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket support for /api/v1/stream
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Ingestion API, path forwarded as sent like /api/. The body limit
    # admits the OTLP receiver's 4 MiB request cap; nginx's 1m default
    # would refuse a large OTLP export with 413 before ingestion saw it.
    # Production (nginx.prod.conf) allows 10m here.
    location /ingest/ {
        client_max_body_size 4m;
        proxy_pass http://ingestion;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
